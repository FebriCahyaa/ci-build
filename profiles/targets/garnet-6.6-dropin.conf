# RisingOS 9 garnet - module-ABI-compatible drop-in boot Image.
# Uses the exact kernel source commit and extracted kernel config from the
# prebuilt OTA so ROM vendor modules keep loading. This is a compatibility
# profile, not a daily-driver source: do not add feature patches here without
# rebuilding the matching modules.

# Target identity
PROFILE_ID="garnet-6.6-dropin"
PROFILE_DEVICE="garnet"
PROFILE_KERNEL_FAMILY="6.6"
PROFILE_ARCH="arm64"
PROFILE_SOURCE_LABEL="RisingOS 9 Garnet 6.6 Drop-In"
PROFILE_KERNEL_NAME="RisingOSDropIn"

# Exact source used by the risingOS OTA kernel
PROFILE_KERNEL_REPO="https://github.com/sudo-joaopuser/android_kernel_xiaomi_sm7435-6.6.git"
PROFILE_KERNEL_REF="19a3d095cd97e3ba3515ded677637dfe3fcb2ae8"
PROFILE_KERNEL_REF_TYPE="commit"

# Exact .config extracted from the OTA boot.img
PROFILE_DEFCONFIG="gki_defconfig"
PROFILE_CONFIG_FRAGMENT="profiles/fragments/garnet-6.6-risingos-dropin.config"
PROFILE_KEEP_SOURCE_LOCALVERSION="true"

# No source-tree changes: every config/ABI difference would break modules.
PROFILE_SCHEDULER_PROFILE="auto"
PROFILE_PATCH_PROFILE="none"
PROFILE_UPSTREAM_PROFILE="none"
PROFILE_LTO_PLUS="false"
PROFILE_TWEAKS="none"

# Only a plain boot Image swap is validated here.
PROFILE_DEFAULT_VARIANTS="vanilla"
PROFILE_PREINTEGRATED_VARIANTS=""
PROFILE_KERNEL_REF_KSU_NEXT_SUSFS=""
PROFILE_KERNEL_REF_FINASU=""
PROFILE_KSU_NEXT_44_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_LEGACY_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_GKI_REF="896f45a78c0806cfd585c4e14e6989f867b143d7"
PROFILE_RESUKISU_REF="v4.2.0-rc3"
PROFILE_SUKISU_ULTRA_REF="main"

# The ROM modules were built with clang 21 / r563880c (confirmed by the
# vermagic CONFIG_CC_VERSION_TEXT in the extracted boot.img), not the
# r510928 named in build.config.constants. MODVERSIONS CRCs are generated
# from preprocessed sources, so the compiler revision must match too.
PROFILE_TOOLCHAIN="aosp-sparse"
PROFILE_TOOLCHAIN_VERSION="clang-r563880c"
PROFILE_LLVM_IAS="1"
PROFILE_AOSP_CLANG_REF="android17-release"
PROFILE_AOSP_CLANG_DIR="clang-r563880c"

# Packaging / flash metadata (boot-only AnyKernel policy).
PROFILE_ROM_FAMILY="oss"
PROFILE_DYNAMIC_PARTITION="true"
PROFILE_GKI="true"
PROFILE_PACKAGE_ANYKERNEL="true"
PROFILE_ANYKERNEL_PROFILE="garnet-6.6"
PROFILE_ANYKERNEL3_REF="master"
