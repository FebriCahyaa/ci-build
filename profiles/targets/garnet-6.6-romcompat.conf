# Garnet 6.6 cross-ROM compatibility profile.
# Uses the managed ZairenOX source with CONFIG_GARNET_ROM_MODULE_COMPAT so one
# source tree can boot prebuilt garnet 6.6 ROMs whose vendor modules were built
# from different kernel trees. Override CONFIG_FRAGMENT with the ROM's own
# extracted .config followed by garnet-6.6-rom-module-compat.config.

# Target identity
PROFILE_ID="garnet-6.6-romcompat"
PROFILE_DEVICE="garnet"
PROFILE_KERNEL_FAMILY="6.6"
PROFILE_ARCH="arm64"
PROFILE_SOURCE_LABEL="Garnet 6.6 Cross-ROM Compatibility"
PROFILE_KERNEL_NAME="ZairenOXRomCompat"

# Managed source, pinned to the loader-compatibility commit.
PROFILE_KERNEL_REPO="https://github.com/FebriCahyaa/android_kernel_xiaomi_garnet_6.6.git"
PROFILE_KERNEL_REF="0ae595b65037"
PROFILE_KERNEL_REF_TYPE="commit"

# Default config is the managed daily-driver config. A cross-ROM build must
# override CONFIG_FRAGMENT with the extracted ROM config plus the compat
# fragment; the loader bridge is compiled from the source branch itself.
PROFILE_DEFCONFIG="gki_defconfig"
PROFILE_CONFIG_FRAGMENT="vendor/parrot_perf.config,vendor/garnet_GKI.config"
PROFILE_KEEP_SOURCE_LOCALVERSION="true"

PROFILE_SCHEDULER_PROFILE="auto"
PROFILE_PATCH_PROFILE="none"
PROFILE_UPSTREAM_PROFILE="none"
PROFILE_LTO_PLUS="false"
PROFILE_TWEAKS="none"

PROFILE_DEFAULT_VARIANTS="vanilla"
PROFILE_PREINTEGRATED_VARIANTS=""
PROFILE_KERNEL_REF_KSU_NEXT_SUSFS=""
PROFILE_KERNEL_REF_FINASU=""
PROFILE_KSU_NEXT_44_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_LEGACY_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_GKI_REF="896f45a78c0806cfd585c4e14e6989f867b143d7"
PROFILE_RESUKISU_REF="v4.2.0-rc3"
PROFILE_SUKISU_ULTRA_REF="main"

PROFILE_TOOLCHAIN="aosp-sparse"
PROFILE_TOOLCHAIN_VERSION="clang-r510928"
PROFILE_LLVM_IAS="1"
PROFILE_AOSP_CLANG_REF="main-kernel-build-2024"
PROFILE_AOSP_CLANG_DIR="clang-r510928"

# Packaging / flash metadata (boot-only AnyKernel policy).
PROFILE_ROM_FAMILY="custom-android"
PROFILE_DYNAMIC_PARTITION="true"
PROFILE_GKI="true"
PROFILE_PACKAGE_ANYKERNEL="true"
PROFILE_ANYKERNEL_PROFILE="garnet-6.6"
PROFILE_ANYKERNEL3_REF="master"
