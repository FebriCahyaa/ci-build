# Xiaomi Redmi Note 7 (lavender) - Linux 4.19 non-GKI (SouthWest-NG).
# Root providers use manual hooks: kprobe/tracepoint hooks bootloop on this
# Clang CFI + LTO tree. SukiSU Ultra main only offers kprobe hooks (KSU depends
# on KPROBES), so it is not in the default matrix; select it explicitly.
# resukisu-susfs = ReSukiSU + SUSFS v2.2.0 inline hooks (ENABLE_SUSFS=true).
# Sourced by scripts/resolve_build_profile.sh; keep values shell-quoted.

# Target identity
PROFILE_ID="lavender-4.19"
PROFILE_DEVICE="lavender"
PROFILE_KERNEL_FAMILY="4.19"
PROFILE_ARCH="arm64"
PROFILE_SOURCE_LABEL="SouthWest-NG"

# Kernel source
PROFILE_KERNEL_REPO="https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng.git"
PROFILE_KERNEL_REF="main"
PROFILE_KERNEL_REF_TYPE="branch"
PROFILE_DEFCONFIG="vendor/xiaomi/sdm660_defconfig"
PROFILE_CONFIG_FRAGMENT="vendor/xiaomi/lavender.config"

# Patch registry / features
PROFILE_SCHEDULER_PROFILE="auto"
PROFILE_PATCH_PROFILE="none"
PROFILE_UPSTREAM_PROFILE="none"
PROFILE_LTO_PLUS="false"

# Root variants (VARIANTS=default|all expands to PROFILE_DEFAULT_VARIANTS)
PROFILE_DEFAULT_VARIANTS="vanilla,kernelsu-next,resukisu,resukisu-susfs"
PROFILE_KSU_NEXT_44_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_LEGACY_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_GKI_REF="v3.4.0"
PROFILE_RESUKISU_REF="v4.2.0-rc3"
PROFILE_SUKISU_ULTRA_REF="main"

# Packaging / flash metadata
PROFILE_ROM_FAMILY="custom-android"
PROFILE_DYNAMIC_PARTITION="true"
PROFILE_GKI="false"
PROFILE_PACKAGE_ANYKERNEL="true"
PROFILE_ANYKERNEL_PROFILE="lavender-4.19"
PROFILE_ANYKERNEL3_REF="master"

# Zairenkai / ZKFC
# Pin the integration source to a reviewed Zairenkai commit for reproducible CI.
PROFILE_ZAIRENKAI="true"
PROFILE_ZAIRENKAI_REPO="https://github.com/FebriCahyaa/Zairenkai.git"
PROFILE_ZAIRENKAI_REF="3b49d3d31bce9cd22b81c5f60bec41b99fcb941a"
PROFILE_ZAIRENKAI_TAG="zairenkai-sdm660-lavender"
PROFILE_ZAIRENKAI_HOOK_MODE="manual"
