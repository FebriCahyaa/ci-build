# Redmi Note 13 Pro 5G / POCO X6 5G (garnet) - Linux 5.10 GKI.
# Sourced by scripts/resolve_build_profile.sh; keep values shell-quoted.

# Target identity
PROFILE_ID="garnet-gki"
PROFILE_DEVICE="garnet"
PROFILE_KERNEL_FAMILY="5.10"
PROFILE_ARCH="arm64"
PROFILE_SOURCE_LABEL="Xiaomi Garnet GKI"

# Kernel source
PROFILE_KERNEL_REPO="https://github.com/FebriCahyaa/kernel_xiaomi_garnet.git"
PROFILE_KERNEL_REF="garnet-t-oss"
PROFILE_KERNEL_REF_TYPE="branch"
PROFILE_DEFCONFIG="gki_defconfig"
PROFILE_CONFIG_FRAGMENT="none"

# Patch registry / features
PROFILE_SCHEDULER_PROFILE="auto"
PROFILE_PATCH_PROFILE="auto"
PROFILE_UPSTREAM_PROFILE="none"
PROFILE_LTO_PLUS="false"

# Root variants (VARIANTS=default|all expands to PROFILE_DEFAULT_VARIANTS)
PROFILE_DEFAULT_VARIANTS="vanilla,kernelsu-next,resukisu,sukisu-ultra"
PROFILE_KSU_NEXT_44_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_LEGACY_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_GKI_REF="v3.4.0"
PROFILE_RESUKISU_REF="v4.2.0-rc3"
PROFILE_SUKISU_ULTRA_REF="main"

# Packaging / flash metadata
PROFILE_ROM_FAMILY="oss"
PROFILE_DYNAMIC_PARTITION="true"
PROFILE_GKI="true"
PROFILE_PACKAGE_ANYKERNEL="true"
PROFILE_ANYKERNEL_PROFILE="garnet-gki"
PROFILE_ANYKERNEL3_REF="master"
