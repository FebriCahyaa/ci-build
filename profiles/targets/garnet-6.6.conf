# Redmi Note 13 Pro 5G / POCO X6 5G (garnet) - Linux 6.6 GKI (ZairenOX).
# Sourced by scripts/resolve_build_profile.sh; keep values shell-quoted.
# Migrated from the retired FebriCahyaa/garnet-kernel-builder repository.

# Target identity
PROFILE_ID="garnet-6.6"
PROFILE_DEVICE="garnet"
PROFILE_KERNEL_FAMILY="6.6"
PROFILE_ARCH="arm64"
PROFILE_SOURCE_LABEL="Xiaomi Garnet 6.6 GKI / ZairenOX"
PROFILE_KERNEL_NAME="ZairenOX"

# Kernel source (full AOSP kernel/common android15-6.6-lts history)
PROFILE_KERNEL_REPO="https://github.com/FebriCahyaa/android_kernel_xiaomi_garnet_6.6.git"
PROFILE_KERNEL_REF="garnet-6.6"
PROFILE_KERNEL_REF_TYPE="branch"

# Direct GKI build: SoC fragment + device fragment (device fragment carries the
# -ZairenOX-Oz1B localversion and the UMM/thermal fixes).
PROFILE_DEFCONFIG="gki_defconfig"
PROFILE_CONFIG_FRAGMENT="vendor/parrot_perf.config,vendor/garnet_GKI.config"

# Patch registry / features
PROFILE_SCHEDULER_PROFILE="auto"
PROFILE_PATCH_PROFILE="auto"
PROFILE_UPSTREAM_PROFILE="none"
PROFILE_LTO_PLUS="false"

# Root variants. The SUSFS and FinaSU trees are already integrated on their
# own kernel branches, so the matrix uses those refs as source seeds instead of
# re-applying provider patches to the vanilla tree.
PROFILE_DEFAULT_VARIANTS="vanilla,kernelsu-next,kernelsu-next-susfs,finasu"
PROFILE_PREINTEGRATED_VARIANTS="kernelsu-next-susfs,finasu"
PROFILE_KERNEL_REF_KSU_NEXT_SUSFS="feature/ksu-next-susfs"
PROFILE_KERNEL_REF_FINASU="feature/finasu"
PROFILE_KSU_NEXT_44_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_LEGACY_REF="v3.4.0-legacy"
PROFILE_KSU_NEXT_GKI_REF="896f45a78c0806cfd585c4e14e6989f867b143d7"
PROFILE_RESUKISU_REF="v4.2.0-rc3"
PROFILE_SUKISU_ULTRA_REF="main"

# Toolchain: pinned AOSP clang matching build.config.constants (r510928).
# Sparse git checkout avoids the gitiles archive size limit for this revision.
PROFILE_TOOLCHAIN="aosp-sparse"
PROFILE_TOOLCHAIN_VERSION="clang-r510928"
PROFILE_LLVM_IAS="1"
PROFILE_AOSP_CLANG_REF="main-kernel-build-2024"
PROFILE_AOSP_CLANG_DIR="clang-r510928"

# Packaging / flash metadata
PROFILE_ROM_FAMILY="oss"
PROFILE_DYNAMIC_PARTITION="true"
PROFILE_GKI="true"
PROFILE_PACKAGE_ANYKERNEL="true"
PROFILE_ANYKERNEL_PROFILE="garnet-6.6"
PROFILE_ANYKERNEL3_REF="master"
