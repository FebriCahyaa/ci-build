# Local Docker Runner is recommended for Android ROM/AOSP builds.
# This pipeline uses the Harness Docker runtime, not Harness Cloud.
pipeline:
  name: Build ROM
  identifier: Build_ROM
  projectIdentifier: ci_build
  orgIdentifier: default

  properties:
    ci:
      codebase:
        connectorRef: github_connector
        repoName: ci-build
        build: <+input>

  variables:
    - name: MANIFEST_URL
      type: String
      value: <+input>

    - name: MANIFEST_BRANCH
      type: String
      value: <+input>

    - name: LOCAL_MANIFEST_URL
      type: String
      value: ""

    - name: LOCAL_MANIFEST_BRANCH
      type: String
      value: ""

    - name: DEVICE
      type: String
      value: garnet

    - name: LUNCH_TARGET
      type: String
      value: <+input>

    - name: BUILD_CMD
      type: String
      value: mka bacon

    - name: CCACHE_SIZE
      type: String
      value: 100G

    - name: RCLONE_REMOTE
      type: String
      value: ""

  stages:
    - stage:
        name: Build ROM
        identifier: build_rom
        type: CI
        spec:
          cloneCodebase: true

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Docker
            spec: {}

          execution:
            steps:
              - step:
                  type: Run
                  name: Build Custom ROM
                  identifier: build_custom_rom
                  timeout: 24h
                  spec:
                    image: ubuntu:22.04
                    shell: Bash

                    envVariables:
                      TG_BOT_TOKEN: <+secrets.getValue("tg_bot_token")>
                      TG_CHAT_ID: <+secrets.getValue("tg_chat_id")>
                      MANIFEST_URL: <+pipeline.variables.MANIFEST_URL>
                      MANIFEST_BRANCH: <+pipeline.variables.MANIFEST_BRANCH>
                      LOCAL_MANIFEST_URL: <+pipeline.variables.LOCAL_MANIFEST_URL>
                      LOCAL_MANIFEST_BRANCH: <+pipeline.variables.LOCAL_MANIFEST_BRANCH>
                      DEVICE: <+pipeline.variables.DEVICE>
                      LUNCH_TARGET: <+pipeline.variables.LUNCH_TARGET>
                      BUILD_CMD: <+pipeline.variables.BUILD_CMD>
                      CCACHE_SIZE: <+pipeline.variables.CCACHE_SIZE>
                      RCLONE_REMOTE: <+pipeline.variables.RCLONE_REMOTE>
                      ROM_DIR: /workspace/rom
                      RUN_URL: <+pipeline.executionUrl>

                    command: |
                      set -euo pipefail
                      export DEBIAN_FRONTEND=noninteractive

                      apt-get update

                      apt-get install -y --no-install-recommends \
                        bc bison build-essential ccache curl flex \
                        g++-multilib gcc-multilib git git-lfs gnupg gperf \
                        imagemagick lib32readline-dev lib32z1-dev libelf-dev \
                        liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
                        libxml2-utils lzop pngcrush rsync schedtool \
                        squashfs-tools xsltproc zip zlib1g-dev python3 \
                        ca-certificates jq unzip rclone

                      if ! command -v repo >/dev/null 2>&1; then
                        curl -fL --retry 3 \
                          https://storage.googleapis.com/git-repo-downloads/repo \
                          -o /usr/local/bin/repo
                        chmod +x /usr/local/bin/repo
                      fi

                      chmod +x ./scripts/build_rom.sh
                      ./scripts/build_rom.sh
