pipeline:
  name: Universal Kernel Build
  identifier: Universal_Kernel_Build
  projectIdentifier: ci_build
  orgIdentifier: default

  variables:
    - name: CI_BUILD_SHA
      type: String
      value: ""
    - name: BUILD_PROFILE
      type: String
      value: lavender-4.4
    - name: ROOT_VARIANTS
      type: String
      value: vanilla,kernelsu-next,resukisu
    - name: KERNEL_REPO_OVERRIDE
      type: String
      value: ""
    - name: KERNEL_REF_OVERRIDE
      type: String
      value: ""
    - name: DEFCONFIG_OVERRIDE
      type: String
      value: ""
    - name: CONFIG_FRAGMENT_OVERRIDE
      type: String
      value: ""
    - name: JOBS
      type: String
      value: "0"
    - name: TOOLCHAIN
      type: String
      value: auto
    - name: TOOLCHAIN_VERSION
      type: String
      value: auto
    - name: LLVM_IAS
      type: String
      value: auto
    - name: CLANG_URL
      type: String
      value: ""
    - name: GCC_URL
      type: String
      value: ""
    - name: EXTRA_MAKE_ARGS
      type: String
      value: ""
    - name: PATCH_PROFILE
      type: String
      value: auto
    - name: UPSTREAM_PROFILE
      type: String
      value: auto
    - name: LTO_PLUS
      type: String
      value: "false"
    - name: KSU_REF
      type: String
      value: auto
    - name: PACKAGE_ANYKERNEL
      type: String
      value: "true"
    - name: ROM_FAMILY
      type: String
      value: auto
    - name: ANYKERNEL_PROFILE
      type: String
      value: auto
    - name: ANYKERNEL3_REF
      type: String
      value: master
    - name: KERNEL_NAME
      type: String
      value: ""
    - name: APT_PACKAGES
      type: String
      value: ""
    - name: PUBLISH_RELEASE
      type: String
      value: "false"

  stages:
    - stage:
        name: Kernel Build
        identifier: kernel_build
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build Universal Kernel Matrix
                  identifier: build_universal_kernel_matrix
                  timeout: 2h 30m
                  spec:
                    shell: Bash
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("github_token")>
                      GH_REPOSITORY: FebriCahyaa/ci-build
                      HARNESS_EXECUTION_ID: <+pipeline.executionId>
                      HARNESS_PIPELINE_ID: Universal_Kernel_Build
                      CI_BUILD_SHA: <+pipeline.variables.CI_BUILD_SHA>
                      BUILD_PROFILE: <+pipeline.variables.BUILD_PROFILE>
                      ROOT_VARIANTS: <+pipeline.variables.ROOT_VARIANTS>
                      KERNEL_REPO: <+pipeline.variables.KERNEL_REPO_OVERRIDE>
                      KERNEL_BRANCH: <+pipeline.variables.KERNEL_REF_OVERRIDE>
                      DEFCONFIG: <+pipeline.variables.DEFCONFIG_OVERRIDE>
                      CONFIG_FRAGMENT: <+pipeline.variables.CONFIG_FRAGMENT_OVERRIDE>
                      JOBS: <+pipeline.variables.JOBS>
                      TOOLCHAIN: <+pipeline.variables.TOOLCHAIN>
                      TOOLCHAIN_VERSION: <+pipeline.variables.TOOLCHAIN_VERSION>
                      LLVM_IAS: <+pipeline.variables.LLVM_IAS>
                      CLANG_URL: <+pipeline.variables.CLANG_URL>
                      GCC_URL: <+pipeline.variables.GCC_URL>
                      EXTRA_MAKE_ARGS: <+pipeline.variables.EXTRA_MAKE_ARGS>
                      PATCH_PROFILE: <+pipeline.variables.PATCH_PROFILE>
                      UPSTREAM_PROFILE: <+pipeline.variables.UPSTREAM_PROFILE>
                      LTO_PLUS: <+pipeline.variables.LTO_PLUS>
                      KSU_REF: <+pipeline.variables.KSU_REF>
                      PACKAGE_ANYKERNEL: <+pipeline.variables.PACKAGE_ANYKERNEL>
                      ROM_FAMILY: <+pipeline.variables.ROM_FAMILY>
                      ANYKERNEL_PROFILE: <+pipeline.variables.ANYKERNEL_PROFILE>
                      ANYKERNEL3_REF: <+pipeline.variables.ANYKERNEL3_REF>
                      KERNEL_NAME: <+pipeline.variables.KERNEL_NAME>
                      APT_PACKAGES: <+pipeline.variables.APT_PACKAGES>
                      RUN_URL: <+pipeline.executionUrl>
                      CI_ARTIFACT_STAGE: "true"
                      CI_ARTIFACT_RELEASE_TAG: harness-<+pipeline.executionId>
                    command: |
                      set -Eeuo pipefail
                      export DEBIAN_FRONTEND=noninteractive
                      CI_DIR="$PWD/ci-build"
                      rm -rf "$CI_DIR"
                      git clone --depth=1 https://github.com/FebriCahyaa/ci-build.git "$CI_DIR"

                      if [[ -n "${CI_BUILD_SHA:-}" ]]; then
                        git -C "$CI_DIR" fetch --depth=1 origin "$CI_BUILD_SHA"
                        git -C "$CI_DIR" checkout --detach "$CI_BUILD_SHA"
                      fi

                      echo "== ci-build revision =="
                      git -C "$CI_DIR" log -1 --oneline
                      git -C "$CI_DIR" rev-parse HEAD

                      cd "$CI_DIR"
                      chmod +x scripts/*.sh
                      bash scripts/install_deps.sh

                      eval "$(BUILD_PROFILE="$BUILD_PROFILE" bash scripts/resolve_build_profile.sh)"
                      echo "PROFILE_ID=$PROFILE_ID"
                      echo "DEVICE=$PROFILE_DEVICE"
                      echo "KERNEL_FAMILY=$PROFILE_KERNEL_FAMILY"
                      echo "KERNEL_REPO=$PROFILE_KERNEL_REPO"
                      echo "ROOT_VARIANTS=$ROOT_VARIANTS"

                      # Empty override variables intentionally fall back to the profile registry.
                      export KERNEL_REPO KERNEL_BRANCH DEFCONFIG CONFIG_FRAGMENT
                      export ARTIFACT_DIR="$PWD/work"
                      export MATRIX_WORK_DIR="$PWD/work"
                      bash scripts/build_variants.sh

                      if [[ "${PUBLISH_RELEASE,,}" == "true" ]]; then
                        RELEASE_DIR="$PWD/release"
                        ASSET_DIR="$RELEASE_DIR/assets"
                        mkdir -p "$ASSET_DIR"
                        find work -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} "$ASSET_DIR/" \;
                        test -n "$(find "$ASSET_DIR" -type f -print -quit)"
                        INFO_ROOT="$PWD/work" OUT_FILE="$RELEASE_DIR/CHANGELOG.md" bash scripts/generate_changelog.sh aggregate
                        cp -f "$RELEASE_DIR/CHANGELOG.md" "$ASSET_DIR/CHANGELOG.md"
                        (cd "$ASSET_DIR" && sha256sum *.tar.gz *.zip CHANGELOG.md > SHA256SUMS)
                        RELEASE_TAG="harness-${HARNESS_EXECUTION_ID}"
                        GH_TOKEN="$GH_TOKEN" GH_REPOSITORY="$GH_REPOSITORY" \
                          RELEASE_TAG="$RELEASE_TAG" RELEASE_NAME="Zairenkai ${BUILD_PROFILE}" \
                          RELEASE_BODY_FILE="$RELEASE_DIR/CHANGELOG.md" RELEASE_DRAFT=false RELEASE_PRERELEASE=false \
                          RELEASE_CLEAN_STAGING=true ASSET_DIR="$ASSET_DIR" bash scripts/publish_ci_release.sh
                      fi

                      printf '%s\n' "matrix_summary=$PWD/work/matrix-summary.txt" > "$PWD/harness-output.env"
