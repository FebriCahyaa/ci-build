pipeline:
  name: Universal Kernel Build
  identifier: Universal_Kernel_Build
  projectIdentifier: ci_build
  orgIdentifier: default

  variables:
    - name: CI_BUILD_SHA
      type: String
      value: ""

    - name: KERNEL_REPO
      type: String
      value: https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng

    - name: KERNEL_BRANCH
      type: String
      value: main

    - name: KERNEL_REF_TYPE
      type: String
      value: branch

    - name: DEVICE
      type: String
      value: lavender

    - name: ARCH
      type: String
      value: auto

    - name: DEFCONFIG
      type: String
      value: auto

    - name: CONFIG_FRAGMENT
      type: String
      value: auto

    - name: JOBS
      type: String
      value: <+input>

    - name: TOOLCHAIN
      type: String
      value: <+input>

    - name: TOOLCHAIN_VERSION
      type: String
      value: <+input>

    - name: LLVM_IAS
      type: String
      value: <+input>

    - name: CROSS_COMPILE
      type: String
      value: <+input>

    - name: CROSS_COMPILE_ARM32
      type: String
      value: <+input>

    - name: CLANG_URL
      type: String
      value: <+input>

    - name: GCC_URL
      type: String
      value: <+input>

    - name: APT_PACKAGES
      type: String
      value: <+input>

    - name: EXTRA_MAKE_ARGS
      type: String
      value: <+input>

    - name: SCHEDULER_PROFILE
      type: String
      value: <+input>

    - name: ENABLE_KSU
      type: String
      value: false

    - name: KSU_REF
      type: String
      value: main

    - name: KSU_PROVIDER
      type: String
      value: <+input>

    - name: KSU_REPO
      type: String
      value: <+input>

    - name: KSU_LAYOUT
      type: String
      value: <+input>

    - name: KSU_HOOK_MODE
      type: String
      value: <+input>

    - name: PACKAGE_ANYKERNEL
      type: String
      value: true

    - name: ROM_FAMILY
      type: String
      value: custom-android

    - name: ANYKERNEL_PROFILE
      type: String
      value: auto

    - name: ANYKERNEL3_REPO
      type: String
      value: https://github.com/osm0sis/AnyKernel3

    - name: ANYKERNEL3_REF
      type: String
      value: master

    - name: PATCH_PROFILE
      type: String
      value: none

    - name: UPSTREAM_PROFILE
      type: String
      value: none

    - name: LTO_PLUS
      type: String
      value: false

    - name: KERNEL_NAME
      type: String
      value: ""

  stages:
    - stage:
        name: Kernel Build
        identifier: kernel_build
        type: CI
        spec:
          cloneCodebase: false

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - step:
                  type: Run
                  name: Build Universal Kernel
                  identifier: build_universal_kernel
                  timeout: 2h

                  spec:
                    shell: Bash

                    envVariables:
                      GH_TOKEN: <+secrets.getValue("github_token")>
                      GH_REPOSITORY: FebriCahyaa/ci-build

                      HARNESS_EXECUTION_ID: <+pipeline.executionId>

                      KERNEL_REPO: <+pipeline.variables.KERNEL_REPO>
                      KERNEL_BRANCH: <+pipeline.variables.KERNEL_BRANCH>
                      KERNEL_REF_TYPE: <+pipeline.variables.KERNEL_REF_TYPE>

                      DEVICE: <+pipeline.variables.DEVICE>
                      ARCH: <+pipeline.variables.ARCH>

                      DEFCONFIG: <+pipeline.variables.DEFCONFIG>
                      CONFIG_FRAGMENT: <+pipeline.variables.CONFIG_FRAGMENT>

                      JOBS: <+pipeline.variables.JOBS>

                      TOOLCHAIN: <+pipeline.variables.TOOLCHAIN>
                      TOOLCHAIN_VERSION: <+pipeline.variables.TOOLCHAIN_VERSION>
                      LLVM_IAS: <+pipeline.variables.LLVM_IAS>

                      CROSS_COMPILE: <+pipeline.variables.CROSS_COMPILE>
                      CROSS_COMPILE_ARM32: <+pipeline.variables.CROSS_COMPILE_ARM32>

                      CLANG_URL: <+pipeline.variables.CLANG_URL>
                      GCC_URL: <+pipeline.variables.GCC_URL>

                      APT_PACKAGES: <+pipeline.variables.APT_PACKAGES>
                      EXTRA_MAKE_ARGS: <+pipeline.variables.EXTRA_MAKE_ARGS>

                      SCHEDULER_PROFILE: <+pipeline.variables.SCHEDULER_PROFILE>

                      ENABLE_KSU: <+pipeline.variables.ENABLE_KSU>
                      KSU_REF: <+pipeline.variables.KSU_REF>
                      KSU_PROVIDER: <+pipeline.variables.KSU_PROVIDER>
                      KSU_REPO: <+pipeline.variables.KSU_REPO>
                      KSU_LAYOUT: <+pipeline.variables.KSU_LAYOUT>
                      KSU_HOOK_MODE: <+pipeline.variables.KSU_HOOK_MODE>

                      PACKAGE_ANYKERNEL: <+pipeline.variables.PACKAGE_ANYKERNEL>

                      ROM_FAMILY: <+pipeline.variables.ROM_FAMILY>
                      ANYKERNEL_PROFILE: <+pipeline.variables.ANYKERNEL_PROFILE>
                      ANYKERNEL3_REPO: <+pipeline.variables.ANYKERNEL3_REPO>
                      ANYKERNEL3_REF: <+pipeline.variables.ANYKERNEL3_REF>

                      PATCH_PROFILE: <+pipeline.variables.PATCH_PROFILE>
                      UPSTREAM_PROFILE: <+pipeline.variables.UPSTREAM_PROFILE>
                      LTO_PLUS: <+pipeline.variables.LTO_PLUS>
                      KERNEL_NAME: <+pipeline.variables.KERNEL_NAME>

                      RUN_URL: <+pipeline.executionUrl>

                    command: |
                      set -euo pipefail
                      export DEBIAN_FRONTEND=noninteractive

                      echo "=================================================="
                      echo " Universal Kernel Build"
                      echo "=================================================="

                      # --------------------------------------------------
                      # Clone ci-build first so all helper scripts are
                      # available before dependency installation/build.
                      # --------------------------------------------------
                      CI_BUILD_DIR="$PWD/ci-build"

                      rm -rf "$CI_BUILD_DIR"

                      git clone --depth=1 --branch main \
                        https://github.com/FebriCahyaa/ci-build.git \
                        "$CI_BUILD_DIR"

                      echo
                      echo "==> ci-build revision"
                      git -C "$CI_BUILD_DIR" log -1 --oneline
                      git -C "$CI_BUILD_DIR" rev-parse HEAD

                      # --------------------------------------------------
                      # Verify required scripts exist before continuing.
                      # --------------------------------------------------
                      for script in \
                        build_kernel.sh \
                        detect_defconfig.sh \
                        toolchain_resolver.sh \
                        publish_ci_release.sh \
                        github_harness_preflight.sh
                      do
                        test -f "$CI_BUILD_DIR/scripts/$script" || {
                          echo "ERROR: missing ci-build script: $script" >&2
                          exit 1
                        }
                      done

                      chmod +x \
                        "$CI_BUILD_DIR/scripts/build_kernel.sh" \
                        "$CI_BUILD_DIR/scripts/detect_defconfig.sh" \
                        "$CI_BUILD_DIR/scripts/toolchain_resolver.sh" \
                        "$CI_BUILD_DIR/scripts/apply_patch_series.sh" \
                        "$CI_BUILD_DIR/scripts/set_kernel_name.sh" \
                        "$CI_BUILD_DIR/scripts/publish_ci_release.sh" \
                        "$CI_BUILD_DIR/scripts/github_harness_preflight.sh"

                      # --------------------------------------------------
                      # GitHub credential preflight.
                      # --------------------------------------------------
                      echo
                      echo "==> GitHub credential preflight"

                      GH_TOKEN="$GH_TOKEN" \
                      GH_REPOSITORY="$GH_REPOSITORY" \
                        "$CI_BUILD_DIR/scripts/github_harness_preflight.sh"

                      # --------------------------------------------------
                      # Print values actually resolved by Harness.
                      # This prevents GitHub/Harness input mismatches
                      # from wasting a full kernel build.
                      # --------------------------------------------------
                      echo
                      echo "=================================================="
                      echo " RESOLVED HARNESS INPUTS"
                      echo "=================================================="

                      printf 'KERNEL_REPO=%s\n' "${KERNEL_REPO:-}"
                      printf 'KERNEL_BRANCH=%s\n' "${KERNEL_BRANCH:-}"
                      printf 'KERNEL_REF_TYPE=%s\n' "${KERNEL_REF_TYPE:-}"
                      printf 'DEVICE=%s\n' "${DEVICE:-}"
                      printf 'ARCH=%s\n' "${ARCH:-}"
                      printf 'DEFCONFIG=%s\n' "${DEFCONFIG:-}"
                      printf 'CONFIG_FRAGMENT=%s\n' "${CONFIG_FRAGMENT:-}"
                      printf 'JOBS=%s\n' "${JOBS:-}"
                      printf 'TOOLCHAIN=%s\n' "${TOOLCHAIN:-}"
                      printf 'TOOLCHAIN_VERSION=%s\n' "${TOOLCHAIN_VERSION:-}"
                      printf 'LLVM_IAS=%s\n' "${LLVM_IAS:-}"
                      printf 'CROSS_COMPILE=%s\n' "${CROSS_COMPILE:-}"
                      printf 'CROSS_COMPILE_ARM32=%s\n' "${CROSS_COMPILE_ARM32:-}"
                      printf 'SCHEDULER_PROFILE=%s\n' "${SCHEDULER_PROFILE:-}"
                      printf 'ENABLE_KSU=%s\n' "${ENABLE_KSU:-}"
                      printf 'KSU_REF=%s\n' "${KSU_REF:-}"
                      printf 'PACKAGE_ANYKERNEL=%s\n' "${PACKAGE_ANYKERNEL:-}"
                      printf 'ROM_FAMILY=%s\n' "${ROM_FAMILY:-}"
                      printf 'ANYKERNEL_PROFILE=%s\n' "${ANYKERNEL_PROFILE:-}"
                      printf 'ANYKERNEL3_REPO=%s\n' "${ANYKERNEL3_REPO:-}"
                      printf 'ANYKERNEL3_REF=%s\n' "${ANYKERNEL3_REF:-}"

                      # --------------------------------------------------
                      # Hard guard against accidental generic builds.
                      # --------------------------------------------------
                      if [[ -z "$KERNEL_REPO" ]]; then
                        echo "ERROR: KERNEL_REPO is empty" >&2
                        exit 2
                      fi

                      if [[ -z "$KERNEL_BRANCH" ]]; then
                        echo "ERROR: KERNEL_BRANCH is empty" >&2
                        exit 2
                      fi

                      if [[ -z "$DEVICE" || "$DEVICE" == "generic" ]]; then
                        echo "ERROR: DEVICE is missing or still 'generic'." >&2
                        echo "GitHub → Harness input propagation failed." >&2
                        exit 2
                      fi

                      # --------------------------------------------------
                      # Release bridge.
                      # --------------------------------------------------
                      RELEASE_DIR="$PWD/work/ci-release-assets"
                      RELEASE_TAG="harness-$HARNESS_EXECUTION_ID"

                      # --------------------------------------------------
                      # Always preserve the original build exit code.
                      # --------------------------------------------------
                      trap '
                        rc=$?
                        set +e

                        mkdir -p "$RELEASE_DIR"

                        if [ "$rc" -eq 0 ]; then
                          cp -f "$PWD"/work/Kernel-${DEVICE}-*.tar.gz \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          cp -f "$PWD"/work/artifacts/*-AnyKernel3.zip \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          cp -f "$PWD"/work/build.log \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          cp -f "$PWD"/work/artifacts/build-info.txt \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          printf "status=success\nexecution_id=%s\n" \
                            "$HARNESS_EXECUTION_ID" \
                            > "$RELEASE_DIR/build-result.txt"

                        else
                          cp -f "$PWD"/work/build.log \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          cp -f "$PWD"/work/error_tail.log \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          cp -f "$PWD"/work/artifacts/build-info.txt \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          {
                            printf "status=failure\n"
                            printf "execution_id=%s\n" "$HARNESS_EXECUTION_ID"
                            printf "exit_code=%s\n" "$rc"
                            printf "kernel_repo=%s\n" "$KERNEL_REPO"
                            printf "kernel_branch=%s\n" "$KERNEL_BRANCH"
                            printf "device=%s\n" "$DEVICE"
                          } > "$RELEASE_DIR/failure-summary.txt"
                        fi

                        if [ -x "$CI_BUILD_DIR/scripts/publish_ci_release.sh" ]; then
                          GH_TOKEN="$GH_TOKEN" \
                          GH_REPOSITORY="$GH_REPOSITORY" \
                          RELEASE_TAG="$RELEASE_TAG" \
                          RELEASE_NAME="Harness Kernel Build $HARNESS_EXECUTION_ID" \
                          ASSET_DIR="$RELEASE_DIR" \
                          "$CI_BUILD_DIR/scripts/publish_ci_release.sh" \
                          || echo "WARNING: GitHub Release publication failed"
                        fi

                        exit "$rc"
                      ' EXIT

                      # --------------------------------------------------
                      # Install dependencies only once.
                      # --------------------------------------------------
                      echo
                      echo "==> Installing build dependencies"

                      apt-get update

                      apt-get install -y --no-install-recommends \
                        bc \
                        bison \
                        flex \
                        libssl-dev \
                        libelf-dev \
                        clang \
                        lld \
                        llvm \
                        gcc-aarch64-linux-gnu \
                        gcc-arm-linux-gnueabi \
                        build-essential \
                        cpio \
                        git \
                        curl \
                        python3 \
                        zip \
                        xz-utils \
                        zstd \
                        ca-certificates \
                        tar \
                        gzip \
                        ${APT_PACKAGES:-}

                      # --------------------------------------------------
                      # Execute universal kernel builder.
                      # --------------------------------------------------
                      echo
                      echo "==> Starting kernel builder"

                      WORK_DIR="$PWD/work" \
                        "$CI_BUILD_DIR/scripts/build_kernel.sh"