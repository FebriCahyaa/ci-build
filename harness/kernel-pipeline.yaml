pipeline:
  name: Universal Kernel Build
  identifier: Universal_Kernel_Build
  projectIdentifier: ci_build
  orgIdentifier: default

  variables:
    - name: CI_BUILD_SHA
      type: String
      value: <+input>
    - name: BUILD_PROFILE
      type: String
      value: <+input>
    - name: ROOT_VARIANTS
      type: String
      value: <+input>
    - name: KERNEL_REPO_OVERRIDE
      type: String
      value: <+input>
    - name: KERNEL_REF_OVERRIDE
      type: String
      value: <+input>
    - name: DEFCONFIG_OVERRIDE
      type: String
      value: <+input>
    - name: CONFIG_FRAGMENT_OVERRIDE
      type: String
      value: <+input>
    - name: JOBS
      type: String
      value: <+input>
    - name: TOOLCHAIN
      type: String
      value: <+input>
    - name: TOOLCHAIN_VERSION
      type: String
      value: <+input>
    - name: LLVM_IAS
      type: String
      value: <+input>
    - name: CLANG_URL
      type: String
      value: <+input>
    - name: GCC_URL
      type: String
      value: <+input>
    - name: EXTRA_MAKE_ARGS
      type: String
      value: <+input>
    - name: PATCH_PROFILE
      type: String
      value: <+input>
    - name: UPSTREAM_PROFILE
      type: String
      value: <+input>
    - name: LTO_PLUS
      type: String
      value: <+input>
    - name: KSU_REF
      type: String
      value: <+input>
    - name: PACKAGE_ANYKERNEL
      type: String
      value: <+input>
    - name: ROM_FAMILY
      type: String
      value: <+input>
    - name: ANYKERNEL_PROFILE
      type: String
      value: <+input>
    - name: ANYKERNEL3_REF
      type: String
      value: <+input>
    - name: BUILD_CUSTOMIZATION
      type: String
      value: <+input>
    - name: PUBLISH_RELEASE
      type: String
      value: <+input>
    - name: TG_TOPIC_ID
      type: String
      value: <+input>

  stages:
    - stage:
        name: Kernel Build
        identifier: kernel_build
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Prepare Zairenkai license
                  identifier: prepare_zairenkai_license
                  timeout: 5m
                  spec:
                    shell: Bash
                    envVariables:
                      ZAIRENKAI_LICENSE_INC: <+secrets.getValue("zairenkai_license_inc")>
                      BUILD_PROFILE: <+pipeline.variables.BUILD_PROFILE>
                    command: |
                      set -Eeuo pipefail
                      if [[ "$BUILD_PROFILE" != "lavender-4.19" ]]; then
                        echo "[zairenkai] skipped for $BUILD_PROFILE"
                        exit 0
                      fi
                      if [[ -z "${ZAIRENKAI_LICENSE_INC:-}" ]]; then
                        echo "[zairenkai] missing Harness secret: zairenkai_license_inc" >&2
                        exit 1
                      fi
                      license_file=/tmp/zairenkai-zkfc-license.inc
                      printf '%s\n' "$ZAIRENKAI_LICENSE_INC" > "$license_file"
                      chmod 600 "$license_file"
                      byte_count="$(grep -oE '0x[0-9A-Fa-f]{2}' "$license_file" | wc -l | tr -d ' ')"
                      if [[ "$byte_count" != "200" ]]; then
                        echo "[zairenkai] invalid .inc secret: expected 200 bytes, found $byte_count" >&2
                        rm -f "$license_file"
                        exit 1
                      fi
                      echo "[zairenkai] embedded license prepared (200 bytes)"
                  when:
                    condition: <+pipeline.variables.BUILD_PROFILE> == "lavender-4.19"

              - step:
                  type: Run
                  name: Build Universal Kernel Matrix
                  identifier: build_universal_kernel_matrix
                  timeout: 2h 30m
                  spec:
                    shell: Bash
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("github_token")>
                      GH_REPOSITORY: FebriCahyaa/ci-build
                      HARNESS_EXECUTION_ID: <+pipeline.executionId>
                      HARNESS_PIPELINE_ID: Universal_Kernel_Build
                      CI_BUILD_SHA: <+pipeline.variables.CI_BUILD_SHA>
                      TG_BOT_TOKEN: <+secrets.getValue("tg_bot_token")>
                      TG_CHAT_ID: <+secrets.getValue("tg_chat_id")>
                      TG_TOPIC_ID: <+pipeline.variables.TG_TOPIC_ID>
                      TG_REQUIRE_TOPIC: "true"
                      # Harness is the persistence/staging layer. The GitHub Actions relay
                      # materializes these files into a native Actions artifact and Telegram.
                      TG_SEND_ARTIFACTS: "false"
                      TG_SEND_FAILURE_ARTIFACTS: "true"
                      CI_ARTIFACT_STAGE: "true"
                      CI_ARTIFACT_RELEASE_TAG: harness-<+pipeline.executionId>
                      CI_GITHUB_STATUS_ENABLED: "false"
                      ZAIRENKAI_LICENSE_INC_FILE: /tmp/zairenkai-zkfc-license.inc
                      BUILD_PROFILE: <+pipeline.variables.BUILD_PROFILE>
                      ROOT_VARIANTS: <+pipeline.variables.ROOT_VARIANTS>
                      KERNEL_REPO: <+pipeline.variables.KERNEL_REPO_OVERRIDE>
                      KERNEL_BRANCH: <+pipeline.variables.KERNEL_REF_OVERRIDE>
                      DEFCONFIG: <+pipeline.variables.DEFCONFIG_OVERRIDE>
                      CONFIG_FRAGMENT: <+pipeline.variables.CONFIG_FRAGMENT_OVERRIDE>
                      JOBS: <+pipeline.variables.JOBS>
                      TOOLCHAIN: <+pipeline.variables.TOOLCHAIN>
                      TOOLCHAIN_VERSION: <+pipeline.variables.TOOLCHAIN_VERSION>
                      LLVM_IAS: <+pipeline.variables.LLVM_IAS>
                      CLANG_URL: <+pipeline.variables.CLANG_URL>
                      GCC_URL: <+pipeline.variables.GCC_URL>
                      EXTRA_MAKE_ARGS: <+pipeline.variables.EXTRA_MAKE_ARGS>
                      PATCH_PROFILE: <+pipeline.variables.PATCH_PROFILE>
                      UPSTREAM_PROFILE: <+pipeline.variables.UPSTREAM_PROFILE>
                      LTO_PLUS: <+pipeline.variables.LTO_PLUS>
                      KSU_REF: <+pipeline.variables.KSU_REF>
                      PACKAGE_ANYKERNEL: <+pipeline.variables.PACKAGE_ANYKERNEL>
                      ROM_FAMILY: <+pipeline.variables.ROM_FAMILY>
                      ANYKERNEL_PROFILE: <+pipeline.variables.ANYKERNEL_PROFILE>
                      ANYKERNEL3_REF: <+pipeline.variables.ANYKERNEL3_REF>
                      BUILD_CUSTOMIZATION: <+pipeline.variables.BUILD_CUSTOMIZATION>
                      PUBLISH_RELEASE: <+pipeline.variables.PUBLISH_RELEASE>
                      RUN_URL: <+pipeline.executionUrl>
                    command: |
                      set -Eeuo pipefail
                      export DEBIAN_FRONTEND=noninteractive
                      CI_DIR="$PWD/ci-build"
                      rm -rf "$CI_DIR"
                      git clone --depth=1 "https://github.com/${GH_REPOSITORY}.git" "$CI_DIR"

                      # Check out the exact commit first, then initialize the
                      # root-manager submodules so their gitlinks match CI_BUILD_SHA
                      # (not the default branch head of the initial clone).
                      if [[ -n "${CI_BUILD_SHA:-}" ]]; then
                        git -C "$CI_DIR" fetch --depth=1 origin "$CI_BUILD_SHA"
                        git -C "$CI_DIR" -c advice.detachedHead=false checkout --detach "$CI_BUILD_SHA"
                      fi
                      bash "$CI_DIR/scripts/bootstrap_root_manager_submodules.sh"

                      echo "== ci-build revision =="
                      git -C "$CI_DIR" log -1 --oneline
                      git -C "$CI_DIR" rev-parse HEAD

                      cd "$CI_DIR"
                      export ROOT_MANAGER_SOURCE_MODE="submodule"
                      readarray -t customization < <(python3 - "$BUILD_CUSTOMIZATION" <<'PY_CUSTOM'
                      import json, sys
                      v=json.loads(sys.argv[1] or "{}")
                      print(v.get("kernel_name", ""))
                      print(v.get("apt_packages", ""))
                      print(v.get("tweaks", "none"))
                      PY_CUSTOM
                      )
                      export KERNEL_NAME="${customization[0]:-}" APT_PACKAGES="${customization[1]:-}" TWEAKS="${customization[2]:-none}"

                      # The handoff must survive both successful builds and unexpected
                      # setup/compile failures. Keep all finalization inside the EXIT trap.
                      HANDOFF_DONE=false
                      finalize_handoff() {
                        local rc="$1"
                        [[ "$HANDOFF_DONE" == true ]] && return 0
                        HANDOFF_DONE=true
                        set +e

                        mkdir -p "$PWD/work" "$PWD/release/assets"

                        # Never persist owner-issued ZKFC token material into the
                        # release handoff, even on failed builds.
                        rm -f /tmp/zairenkai-zkfc-license.inc
                        find "$PWD/work" -type f \
                          \( -path '*/Zairenkai/kernel/license/zkfc_license.inc' -o -path '*/Zairenkai/kernel/license/zkfc_crl.inc' \) \
                          -delete 2>/dev/null || true

                        printf 'status=%s\nprofile=%s\nexecution_id=%s\nexit_code=%s\n' \
                          "$([[ "$rc" == 0 ]] && echo SUCCEEDED || echo FAILED)" \
                          "$BUILD_PROFILE" "$HARNESS_EXECUTION_ID" "$rc" > "$PWD/work/harness-result.txt"

                        if [[ -f scripts/assemble_release_assets.sh ]]; then
                          SOURCE_ROOT="$PWD/work" \
                          ASSET_DIR="$PWD/release/assets" \
                          CHANGELOG_OUT="$PWD/release/CHANGELOG.md" \
                          BUILD_PROFILE="$BUILD_PROFILE" \
                          MATRIX_SUMMARY="$PWD/work/matrix-summary.txt" \
                          bash scripts/assemble_release_assets.sh || \
                            echo "[harness] release assembly failed; preserving per-variant staged artifacts" >&2
                        fi

                        # Always create/update the per-execution staging release. This is
                        # the durable handoff read by GitHub Actions after the Harness run.
                        if [[ -f scripts/stage_ci_release_assets.sh ]]; then
                          GH_TOKEN="$GH_TOKEN" GH_REPOSITORY="$GH_REPOSITORY" \
                            RELEASE_TAG="harness-${HARNESS_EXECUTION_ID}" \
                            ASSET_DIR="$PWD/release/assets" \
                            ASSET_PREFIX="handoff" \
                            CLEAN_PREFIX="staging-" \
                            bash scripts/stage_ci_release_assets.sh || \
                            echo "[harness] staging release update failed" >&2
                        fi

                        if [[ "$rc" == 0 && "${PUBLISH_RELEASE,,}" == "true" ]]; then
                          package_count="$(find "$PWD/release/assets" -maxdepth 1 -type f \
                            \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
                          if (( package_count > 0 )); then
                            if GH_TOKEN="$GH_TOKEN" GH_REPOSITORY="$GH_REPOSITORY" \
                              RELEASE_TAG="harness-${HARNESS_EXECUTION_ID}" \
                              RELEASE_NAME="Zairenkai ${BUILD_PROFILE}" \
                              RELEASE_BODY_FILE="$PWD/release/CHANGELOG.md" \
                              RELEASE_DRAFT=false RELEASE_PRERELEASE=false \
                              RELEASE_CLEAN_STAGING=true \
                              ASSET_DIR="$PWD/release/assets" \
                              CI_BUILD_SHA="${CI_BUILD_SHA:-$(git rev-parse HEAD)}" \
                              bash scripts/publish_ci_release.sh; then
                              echo "[harness] public release published; GitHub Actions owns the release-topic Telegram relay" >&2
                            else
                              echo "[harness] public release publication failed; staging handoff remains the fallback" >&2
                            fi
                          else
                            echo "[harness] no installable package exists; retaining diagnostic staging release" >&2
                          fi
                        fi

                        printf '%s\n' \
                          "matrix_summary=$PWD/work/matrix-summary.txt" \
                          "matrix_exit=$rc" \
                          "handoff_release=harness-${HARNESS_EXECUTION_ID}" \
                          > "$PWD/harness-output.env"
                      }
                      trap 'rc=$?; trap - EXIT; finalize_handoff "$rc"; exit "$rc"' EXIT

                      bash scripts/install_deps.sh

                      eval "$(BUILD_PROFILE="$BUILD_PROFILE" bash scripts/resolve_build_profile.sh)"
                      echo "PROFILE_ID=$PROFILE_ID"
                      echo "DEVICE=$PROFILE_DEVICE"
                      echo "KERNEL_FAMILY=$PROFILE_KERNEL_FAMILY"
                      echo "KERNEL_REPO=$PROFILE_KERNEL_REPO"
                      echo "ROOT_VARIANTS=$ROOT_VARIANTS"

                      # Empty override variables intentionally fall back to the profile registry.
                      export KERNEL_REPO KERNEL_BRANCH DEFCONFIG CONFIG_FRAGMENT
                      export ARTIFACT_DIR="$PWD/work"
                      export MATRIX_WORK_DIR="$PWD/work"

                      # Keep the matrix result so final persistence still runs when
                      # one variant fails after another variant has succeeded.
                      matrix_rc=0
                      if bash scripts/build_variants.sh; then
                        matrix_rc=0
                      else
                        matrix_rc=$?
                        echo "[harness] build matrix returned $matrix_rc; continuing to finalize persisted artifacts"
                      fi

                      exit "$matrix_rc"

              - step:
                  type: Run
                  name: Cleanup Zairenkai license
                  identifier: cleanup_zairenkai_license
                  timeout: 2m
                  spec:
                    shell: Bash
                    command: |
                      set -Eeuo pipefail
                      rm -f /tmp/zairenkai-zkfc-license.inc
                      find "$PWD/work" -type f \
                        \( -path '*/Zairenkai/kernel/license/zkfc_license.inc' -o -path '*/Zairenkai/kernel/license/zkfc_crl.inc' \) \
                        -delete 2>/dev/null || true
                  when:
                    stageStatus: All

              - step:
                  type: Plugin
                  name: Publish Harness Artifact Handoff
                  identifier: publish_harness_artifact_handoff
                  timeout: 5m
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/artifact-metadata-publisher
                    settings:
                      file_urls: Zairenkai CI handoff:::https://github.com/FebriCahyaa/ci-build/releases/tag/harness-<+pipeline.executionId>
                      artifact_file: harness-artifact.txt
                  when:
                    stageStatus: All
