pipeline:
  name: Universal Kernel Build
  identifier: Universal_Kernel_Build
  projectIdentifier: ci_build
  orgIdentifier: default

  variables:
    - name: KERNEL_REPO
      type: String
      value: <+input>
    - name: KERNEL_BRANCH
      type: String
      value: <+input>
    - name: KERNEL_REF_TYPE
      type: String
      value: auto
    - name: DEVICE
      type: String
      value: generic
    - name: ARCH
      type: String
      value: auto
    - name: DEFCONFIG
      type: String
      value: auto
    - name: CONFIG_FRAGMENT
      type: String
      value: auto
    - name: JOBS
      type: String
      value: "0"
    - name: TOOLCHAIN
      type: String
      value: auto
    - name: TOOLCHAIN_VERSION
      type: String
      value: auto
    - name: LLVM_IAS
      type: String
      value: auto
    - name: CROSS_COMPILE
      type: String
      value: auto
    - name: CROSS_COMPILE_ARM32
      type: String
      value: ""
    - name: CLANG_URL
      type: String
      value: ""
    - name: GCC_URL
      type: String
      value: ""
    - name: APT_PACKAGES
      type: String
      value: ""
    - name: EXTRA_MAKE_ARGS
      type: String
      value: ""
    - name: SCHEDULER_PROFILE
      type: String
      value: auto
    - name: ENABLE_KSU
      type: String
      value: "false"
    - name: KSU_REF
      type: String
      value: ""
    - name: PACKAGE_ANYKERNEL
      type: String
      value: "false"
    - name: ROM_FAMILY
      type: String
      value: auto
    - name: ANYKERNEL_PROFILE
      type: String
      value: auto
    - name: ANYKERNEL3_REPO
      type: String
      value: https://github.com/osm0sis/AnyKernel3
    - name: ANYKERNEL3_REF
      type: String
      value: master
  stages:
    - stage:
        name: Kernel Build
        identifier: kernel_build
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build Universal Kernel
                  identifier: build_universal_kernel
                  timeout: 2h
                  spec:
                    shell: Bash
                    envVariables:
                      GH_TOKEN: <+secrets.getValue("github_token")>
                      GH_REPOSITORY: FebriCahyaa/ci-build
                      HARNESS_EXECUTION_ID: <+pipeline.executionId>
                      KERNEL_REPO: <+pipeline.variables.KERNEL_REPO>
                      KERNEL_BRANCH: <+pipeline.variables.KERNEL_BRANCH>
                      KERNEL_REF_TYPE: <+pipeline.variables.KERNEL_REF_TYPE>
                      DEVICE: <+pipeline.variables.DEVICE>
                      ARCH: <+pipeline.variables.ARCH>
                      DEFCONFIG: <+pipeline.variables.DEFCONFIG>
                      CONFIG_FRAGMENT: <+pipeline.variables.CONFIG_FRAGMENT>
                      JOBS: <+pipeline.variables.JOBS>
                      TOOLCHAIN: <+pipeline.variables.TOOLCHAIN>
                      TOOLCHAIN_VERSION: <+pipeline.variables.TOOLCHAIN_VERSION>
                      LLVM_IAS: <+pipeline.variables.LLVM_IAS>
                      CROSS_COMPILE: <+pipeline.variables.CROSS_COMPILE>
                      CROSS_COMPILE_ARM32: <+pipeline.variables.CROSS_COMPILE_ARM32>
                      CLANG_URL: <+pipeline.variables.CLANG_URL>
                      GCC_URL: <+pipeline.variables.GCC_URL>
                      APT_PACKAGES: <+pipeline.variables.APT_PACKAGES>
                      EXTRA_MAKE_ARGS: <+pipeline.variables.EXTRA_MAKE_ARGS>
                      SCHEDULER_PROFILE: <+pipeline.variables.SCHEDULER_PROFILE>
                      ENABLE_KSU: <+pipeline.variables.ENABLE_KSU>
                      KSU_REF: <+pipeline.variables.KSU_REF>
                      PACKAGE_ANYKERNEL: <+pipeline.variables.PACKAGE_ANYKERNEL>
                      ROM_FAMILY: <+pipeline.variables.ROM_FAMILY>
                      ANYKERNEL_PROFILE: <+pipeline.variables.ANYKERNEL_PROFILE>
                      ANYKERNEL3_REPO: <+pipeline.variables.ANYKERNEL3_REPO>
                      ANYKERNEL3_REF: <+pipeline.variables.ANYKERNEL3_REF>
                      RUN_URL: <+pipeline.executionUrl>
                    command: |
                      set -euo pipefail
                      export DEBIAN_FRONTEND=noninteractive

                      # Clone ci-build first so the release/error bridge is available
                      # even when dependency installation or the kernel build fails.
                      CI_BUILD_DIR="$PWD/ci-build"
                      rm -rf "$CI_BUILD_DIR"
                      git clone --depth=1 --branch main \
                        https://github.com/FebriCahyaa/ci-build.git "$CI_BUILD_DIR"

                      chmod +x \
                        "$CI_BUILD_DIR/scripts/build_kernel.sh" \
                        "$CI_BUILD_DIR/scripts/detect_defconfig.sh" \
                        "$CI_BUILD_DIR/scripts/toolchain_resolver.sh" \
                        "$CI_BUILD_DIR/scripts/publish_ci_release.sh"

                      RELEASE_DIR="$PWD/work/ci-release-assets"
                      RELEASE_TAG="harness-$HARNESS_EXECUTION_ID"

                      # Always preserve the original Harness step exit code.
                      trap '
                        rc=$?
                        set +e

                        mkdir -p "$RELEASE_DIR"

                        if [ "$rc" -eq 0 ]; then
                          cp -f "$PWD"/work/Kernel-${DEVICE}-*.tar.gz \
                            "$RELEASE_DIR/" 2>/dev/null || true
                          cp -f "$PWD"/work/artifacts/*-AnyKernel3.zip \
                            "$RELEASE_DIR/" 2>/dev/null || true
                          cp -f "$PWD"/work/build.log \
                            "$RELEASE_DIR/" 2>/dev/null || true
                          cp -f "$PWD"/work/artifacts/build-info.txt \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          printf "status=success\nexecution_id=%s\n" \
                            "$HARNESS_EXECUTION_ID" \
                            > "$RELEASE_DIR/build-result.txt"
                        else
                          cp -f "$PWD"/work/build.log \
                            "$RELEASE_DIR/" 2>/dev/null || true
                          cp -f "$PWD"/work/error_tail.log \
                            "$RELEASE_DIR/" 2>/dev/null || true
                          cp -f "$PWD"/work/artifacts/build-info.txt \
                            "$RELEASE_DIR/" 2>/dev/null || true

                          {
                            printf "status=failure\n"
                            printf "execution_id=%s\n" "$HARNESS_EXECUTION_ID"
                            printf "exit_code=%s\n" "$rc"
                            printf "kernel_repo=%s\n" "$KERNEL_REPO"
                            printf "kernel_branch=%s\n" "$KERNEL_BRANCH"
                            printf "device=%s\n" "$DEVICE"
                          } > "$RELEASE_DIR/failure-summary.txt"
                        fi

                        if [ -x "$CI_BUILD_DIR/scripts/publish_ci_release.sh" ]; then
                          GH_TOKEN="$GH_TOKEN" \
                          GH_REPOSITORY="$GH_REPOSITORY" \
                          RELEASE_TAG="$RELEASE_TAG" \
                          RELEASE_NAME="Harness Kernel Build $HARNESS_EXECUTION_ID" \
                          ASSET_DIR="$RELEASE_DIR" \
                          "$CI_BUILD_DIR/scripts/publish_ci_release.sh" \
                          || echo "WARNING: GitHub Release publication failed"
                        fi

                        exit "$rc"
                      ' EXIT

                      # Install dependencies only once.
                      apt-get update
                      apt-get install -y --no-install-recommends \
                        bc bison flex libssl-dev libelf-dev clang lld llvm \
                        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
                        build-essential cpio git curl python3 zip xz-utils zstd \
                        ca-certificates tar gzip \
                        ${APT_PACKAGES:-}

                      # Execute the universal kernel builder.
                      WORK_DIR="$PWD/work" \
                        "$CI_BUILD_DIR/scripts/build_kernel.sh"
