# Xiaomi Redmi Note 13 Pro 5G / POCO X6 5G (garnet) - Linux 6.6 GKI.
PROFILE_ID="garnet-6.6"
PROFILE_DESC="Linux 6.6 GKI (ZairenOX) - A/B boot, Android 15+ init_boot devices"
DEVICE_LABEL="Note 13 Pro 5G / garnet"
DEVICE_NAMES="garnet 2312DRA50G garnetp"
KERNEL_FAMILY="6.6"
SUPPORTED_VERSIONS="14 - 17"
BLOCK="/dev/block/bootdevice/by-name/boot"
IS_SLOT_DEVICE="1"
DYNAMIC_PARTITIONS="required"
GKI="1"
# Vendor DTBO and init_boot ramdisk stay untouched; only the kernel Image is replaced.
# system_dlkm is owned by the ROM: the matching .ko files are in the build
# tarball, but this ZIP never flashes or replaces system_dlkm.
FLASH_DTBO="0"
FLASH_INIT_BOOT="0"
FLASH_SYSTEM_DLKM="0"
SCHEDULERS="EAS"
KERNEL_IMAGES="Image Image.lz4 Image.gz"
