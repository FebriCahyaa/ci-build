name: Harness Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository URL"
        required: true
        type: string
      kernel_branch:
        description: "Kernel branch, tag, or ref"
        required: true
        type: string
        default: "main"
      kernel_ref_type:
        description: "Kernel ref type"
        required: true
        type: choice
        options: [auto, branch, tag, commit]
        default: auto
      device:
        description: "Device codename"
        required: true
        type: string
        default: "garnet"
      arch:
        description: "Architecture"
        required: true
        type: choice
        options: [auto, arm64, arm, x86, riscv]
        default: auto
      defconfig:
        description: "Defconfig (auto = detect)"
        required: true
        type: string
        default: "auto"
      config_fragment:
        description: "Fragment (auto = detect, none = disable)"
        required: true
        type: string
        default: "auto"
      jobs:
        description: "Parallel jobs"
        required: true
        type: string
        default: "0"
      toolchain:
        description: "Toolchain family"
        required: true
        type: choice
        options: [auto, aosp, proton, neutron, llvm, gcc, system]
        default: auto
      toolchain_version:
        description: "Toolchain version/tag"
        required: true
        type: string
        default: "auto"
      llvm_ias:
        description: "LLVM IAS"
        required: true
        type: choice
        options: [auto, "0", "1"]
        default: auto
      cross_compile:
        description: "CROSS_COMPILE prefix"
        required: false
        type: string
        default: "auto"
      cross_compile_arm32:
        description: "Optional 32-bit cross compiler"
        required: false
        type: string
        default: ""
      clang_url:
        description: "Optional custom Clang archive"
        required: false
        type: string
        default: ""
      gcc_url:
        description: "Optional custom GCC archive"
        required: false
        type: string
        default: ""
      apt_packages:
        description: "Optional extra apt packages"
        required: false
        type: string
        default: ""
      extra_make_args:
        description: "Optional extra make arguments"
        required: false
        type: string
        default: ""
      scheduler_profile:
        description: "Scheduler metadata check"
        required: true
        type: choice
        options: [auto, eas, hmp, walt, none]
        default: auto
      enable_ksu:
        description: "Enable KernelSU"
        required: true
        type: boolean
        default: false
      ksu_ref:
        description: "KernelSU ref"
        required: false
        type: string
        default: ""
      package_anykernel:
        description: "Package AnyKernel3"
        required: true
        type: boolean
        default: false
      rom_family:
        description: "ROM family for AnyKernel profile selection"
        required: true
        type: choice
        options: [auto, oss, hyperos, miui, custom-android, legacy]
        default: auto
      anykernel_profile:
        description: "AnyKernel profile"
        required: true
        type: string
        default: "auto"
      anykernel3_ref:
        description: "AnyKernel3 branch, tag, or commit"
        required: true
        type: string
        default: "master"
jobs:
  trigger-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Build Harness API payload
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          PIPELINE_ID: Universal_Kernel_Build
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_REF_TYPE: ${{ inputs.kernel_ref_type }}
          DEVICE: ${{ inputs.device }}
          ARCH: ${{ inputs.arch }}
          DEFCONFIG: ${{ inputs.defconfig }}
          CONFIG_FRAGMENT: ${{ inputs.config_fragment }}
          JOBS: ${{ inputs.jobs }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          LLVM_IAS: ${{ inputs.llvm_ias }}
          CROSS_COMPILE: ${{ inputs.cross_compile }}
          CROSS_COMPILE_ARM32: ${{ inputs.cross_compile_arm32 }}
          CLANG_URL: ${{ inputs.clang_url }}
          GCC_URL: ${{ inputs.gcc_url }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
          SCHEDULER_PROFILE: ${{ inputs.scheduler_profile }}
          ENABLE_KSU: ${{ inputs.enable_ksu }}
          KSU_REF: ${{ inputs.ksu_ref }}
          PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
          ROM_FAMILY: ${{ inputs.rom_family }}
          ANYKERNEL_PROFILE: ${{ inputs.anykernel_profile }}
          ANYKERNEL3_REPO: ${{ inputs.anykernel_repo }}
          ANYKERNEL3_REF: ${{ inputs.anykernel3_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          names = [
            "KERNEL_REPO","KERNEL_BRANCH","KERNEL_REF_TYPE","DEVICE","ARCH","DEFCONFIG","CONFIG_FRAGMENT","JOBS",
            "TOOLCHAIN","TOOLCHAIN_VERSION","LLVM_IAS","CROSS_COMPILE","CROSS_COMPILE_ARM32",
            "CLANG_URL","GCC_URL","APT_PACKAGES","EXTRA_MAKE_ARGS","SCHEDULER_PROFILE",
            "ENABLE_KSU","KSU_REF","PACKAGE_ANYKERNEL","ROM_FAMILY","ANYKERNEL_PROFILE","ANYKERNEL3_REPO","ANYKERNEL3_REF","ANYKERNEL_REPO","ANYKERNEL_BRANCH"
          ]
          payload = {"pipeline": {"identifier": os.environ["PIPELINE_ID"], "variables": [
            {"name": n, "type": "String", "value": os.environ.get(n, "")} for n in names
          ]}}
          # Boolean values are intentionally passed as strings because the Harness pipeline variables are strings.
          with open("harness-payload.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, separators=(",", ":"))
          PY

      - name: Trigger Harness pipeline
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          PIPELINE_ID: Universal_Kernel_Build
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-delay 2 -X POST \
            "https://app.harness.io/pipeline/api/pipeline/execute/${PIPELINE_ID}?accountIdentifier=${HARNESS_ACCOUNT}&orgIdentifier=${HARNESS_ORG}&projectIdentifier=${HARNESS_PROJECT}" \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @harness-payload.json
