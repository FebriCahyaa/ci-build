name: Harness Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Canonical target profile"
        required: true
        type: choice
        options: [lavender-4.4, lavender-4.19, garnet-gki]
        default: lavender-4.4
      root_variants:
        description: "Root variants: vanilla,kernelsu-next,resukisu or all"
        required: true
        type: string
        default: vanilla,kernelsu-next,resukisu
      kernel_repo_override:
        description: "Optional kernel repository override"
        required: false
        type: string
        default: ""
      kernel_ref_override:
        description: "Optional kernel branch/tag/commit override"
        required: false
        type: string
        default: ""
      defconfig_override:
        description: "Optional defconfig override"
        required: false
        type: string
        default: ""
      config_fragment_override:
        description: "Optional config fragment override"
        required: false
        type: string
        default: ""
      jobs:
        description: "Parallel jobs; 0 = auto"
        required: true
        type: string
        default: "0"
      toolchain:
        description: "Toolchain family"
        required: true
        type: choice
        options: [auto, aosp, proton, neutron, llvm, gcc, system]
        default: auto
      toolchain_version:
        description: "Toolchain revision/tag"
        required: true
        type: string
        default: auto
      llvm_ias:
        description: "LLVM IAS mode"
        required: true
        type: choice
        options: [auto, "0", "1"]
        default: auto
      clang_url:
        description: "Optional custom Clang archive URL"
        required: false
        type: string
        default: ""
      gcc_url:
        description: "Optional custom GCC archive URL"
        required: false
        type: string
        default: ""
      extra_make_args:
        description: "Optional extra make arguments"
        required: false
        type: string
        default: ""
      patch_profile:
        description: "Modular patch profile"
        required: true
        type: string
        default: auto
      upstream_profile:
        description: "Upstream patch profile"
        required: true
        type: string
        default: auto
      lto_plus:
        description: "Optional LTO+ profile"
        required: true
        type: boolean
        default: false
      ksu_ref:
        description: "Root provider ref; auto uses target-safe pinned ref"
        required: true
        type: string
        default: auto
      package_anykernel:
        description: "Package AnyKernel3"
        required: true
        type: boolean
        default: true
      rom_family:
        description: "ROM family metadata"
        required: true
        type: choice
        options: [auto, oss, hyperos, miui, custom-android, legacy]
        default: auto
      anykernel_profile:
        description: "AnyKernel profile"
        required: true
        type: string
        default: auto
      anykernel3_ref:
        description: "AnyKernel3 ref for external repository"
        required: true
        type: string
        default: master
      kernel_name:
        description: "Kernel display name"
        required: false
        type: string
        default: ""
      apt_packages:
        description: "Optional extra apt packages"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish Harness result as GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trigger-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Harness preflight
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          python3 -m py_compile scripts/harness_monitor.py
          bash -n scripts/build_variants.sh scripts/build_kernel.sh scripts/publish_ci_release.sh
          test -f profiles/targets/${{ inputs.build_profile }}.conf
          test -f anykernel/anykernel.sh
          git rev-parse HEAD

      - name: Build Harness API payload
        env:
          CI_BUILD_SHA: ${{ github.sha }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          ROOT_VARIANTS: ${{ inputs.root_variants }}
          KERNEL_REPO_OVERRIDE: ${{ inputs.kernel_repo_override }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref_override }}
          DEFCONFIG_OVERRIDE: ${{ inputs.defconfig_override }}
          CONFIG_FRAGMENT_OVERRIDE: ${{ inputs.config_fragment_override }}
          JOBS: ${{ inputs.jobs }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          LLVM_IAS: ${{ inputs.llvm_ias }}
          CLANG_URL: ${{ inputs.clang_url }}
          GCC_URL: ${{ inputs.gcc_url }}
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
          PATCH_PROFILE: ${{ inputs.patch_profile }}
          UPSTREAM_PROFILE: ${{ inputs.upstream_profile }}
          LTO_PLUS: ${{ inputs.lto_plus }}
          KSU_REF: ${{ inputs.ksu_ref }}
          PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
          ROM_FAMILY: ${{ inputs.rom_family }}
          ANYKERNEL_PROFILE: ${{ inputs.anykernel_profile }}
          ANYKERNEL3_REF: ${{ inputs.anykernel3_ref }}
          KERNEL_NAME: ${{ inputs.kernel_name }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          HARNESS_PIPELINE_ID: Universal_Kernel_Build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          names = [
              "CI_BUILD_SHA","BUILD_PROFILE","ROOT_VARIANTS","KERNEL_REPO_OVERRIDE","KERNEL_REF_OVERRIDE",
              "DEFCONFIG_OVERRIDE","CONFIG_FRAGMENT_OVERRIDE","JOBS","TOOLCHAIN","TOOLCHAIN_VERSION","LLVM_IAS",
              "CLANG_URL","GCC_URL","EXTRA_MAKE_ARGS","PATCH_PROFILE","UPSTREAM_PROFILE","LTO_PLUS","KSU_REF",
              "PACKAGE_ANYKERNEL","ROM_FAMILY","ANYKERNEL_PROFILE","ANYKERNEL3_REF","KERNEL_NAME","APT_PACKAGES","PUBLISH_RELEASE"
          ]
          values = {n: os.environ.get(n, "") for n in names}
          if len(names) > 25:
              raise SystemExit(f"Harness variable count {len(names)} exceeds limit 25")
          with open("harness-inputs.yaml", "w", encoding="utf-8") as f:
              f.write("pipeline:\n")
              f.write(f"  identifier: {os.environ['HARNESS_PIPELINE_ID']}\n")
              f.write("  variables:\n")
              for n in names:
                  f.write(f"    - name: {n}\n")
                  f.write("      type: String\n")
                  # JSON quoting is valid YAML and safely preserves special characters.
                  f.write(f"      value: {json.dumps(values[n], ensure_ascii=False)}\n")
          print(f"Harness runtime variable count: {len(names)}")
          print(f"Requested BUILD_PROFILE: {values['BUILD_PROFILE']}")
          print(f"Requested ROOT_VARIANTS: {values['ROOT_VARIANTS']}")
          PY

      - name: Trigger Harness pipeline
        id: trigger
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          PIPELINE_ID: Universal_Kernel_Build
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
        run: |
          set -euo pipefail
          endpoint="https://app.harness.io/pipeline/api/pipeline/execute/${PIPELINE_ID}?accountIdentifier=${HARNESS_ACCOUNT}&orgIdentifier=${HARNESS_ORG}&projectIdentifier=${HARNESS_PROJECT}&moduleType=CI"
          http_code="$(curl -sS --retry 2 --retry-delay 2 -X POST "$endpoint" \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "Content-Type: application/yaml" \
            --data-binary @harness-inputs.yaml \
            -o harness-response.json -w '%{http_code}')"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            cat harness-response.json >&2 || true
            exit 1
          fi
          PLAN_ID="$(python3 - <<'PY'
          import json
          d=json.load(open("harness-response.json", encoding="utf-8"))
          data=d.get("data") or {}
          pe=data.get("planExecution") or {}
          print(pe.get("uuid") or pe.get("planExecutionId") or d.get("planExecutionId") or d.get("executionId") or "")
          PY
          )"
          [[ -n "$PLAN_ID" ]] || { cat harness-response.json >&2; exit 1; }
          echo "plan_execution_id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "release_tag=harness-$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "Requested build profile: ${BUILD_PROFILE}"
          echo "Requested root variants: ${ROOT_VARIANTS}"
          echo "Harness plan execution: $PLAN_ID"

      - name: Live monitor Harness execution
        if: steps.trigger.outputs.plan_execution_id != ''
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          HARNESS_PIPELINE: Universal_Kernel_Build
          HARNESS_PLAN_EXECUTION_ID: ${{ steps.trigger.outputs.plan_execution_id }}
          CI_BUILD_SHA: ${{ github.sha }}
          HARNESS_EXECUTION_URL: https://app.harness.io/ng/account/${{ secrets.HARNESS_ACCOUNT_ID }}/module/ci/orgs/default/projects/ci_build/pipelines/Universal_Kernel_Build/executions/${{ steps.trigger.outputs.plan_execution_id }}/pipeline
          DEVICE: ${{ inputs.build_profile == 'garnet-gki' && 'garnet' || 'lavender' }}
          KERNEL_BRANCH: ${{ inputs.build_profile }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HARNESS_POLL_SECONDS: "3"
          HARNESS_UNKNOWN_IDLE_GRACE_SECONDS: "45"
          TG_UI_INTERVAL: "1"
          HARNESS_API_TIMEOUT: "10"
          HARNESS_GRAPH_FALLBACK_EVERY: "3"
          HARNESS_RELEASE_CHECK_EVERY: "6"
          HARNESS_EXPECTED_STAGE_NAME: "Kernel Build"
          HARNESS_EXPECTED_STEP_NAME: "Build Universal Kernel Matrix"
          TG_HTTP_TIMEOUT: "8"
          HARNESS_MAX_SECONDS: "8100"
        run: python3 scripts/harness_monitor.py

      - name: Relay Harness result to Telegram
        if: always() && steps.trigger.outputs.plan_execution_id != '' && inputs.publish_release
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
          HARNESS_MONITOR_FILE: harness-monitor.json
        run: bash scripts/send_release_to_telegram.sh

      - name: Propagate Harness result
        if: always()
        run: |
          set -euo pipefail
          test -f harness-monitor.json
          status="$(python3 -c 'import json; print(json.load(open("harness-monitor.json",encoding="utf-8")).get("status","UNKNOWN"))')"
          case "$status" in SUCCESS|SUCCEEDED) exit 0 ;; *) echo "Harness result: $status"; exit 1 ;; esac
