name: Harness Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Canonical target profile"
        required: true
        type: choice
        options: [lavender-4.4, lavender-4.19, garnet-gki]
        default: lavender-4.4
      root_variants:
        description: "Root variants: default (profile set), all, or e.g. vanilla,kernelsu-next,resukisu,resukisu-susfs,sukisu-ultra"
        required: true
        type: string
        default: default
      kernel_repo_override:
        description: "Optional kernel repository override"
        required: false
        type: string
        default: ""
      kernel_ref_override:
        description: "Optional kernel branch/tag/commit override"
        required: false
        type: string
        default: ""
      defconfig_override:
        description: "Optional defconfig override"
        required: false
        type: string
        default: ""
      config_fragment_override:
        description: "Optional config fragment override"
        required: false
        type: string
        default: ""
      jobs:
        description: "Parallel jobs; 0 = auto"
        required: true
        type: string
        default: "0"
      toolchain:
        description: "Toolchain family"
        required: true
        type: choice
        options: [auto, aosp, aosp-r416183b, zyc-10, proton, llvm-18, neutron, llvm, gcc, system]
        default: auto
      toolchain_version:
        description: "Toolchain revision/tag"
        required: true
        type: string
        default: auto
      llvm_ias:
        description: "LLVM IAS mode"
        required: true
        type: choice
        options: [auto, "0", "1"]
        default: auto
      toolchain_url:
        description: "Optional custom toolchain archive URL (clang, or GCC when toolchain=gcc)"
        required: false
        type: string
        default: ""
      extra_make_args:
        description: "Optional extra make arguments"
        required: false
        type: string
        default: ""
      patch_profile:
        description: "Modular patch profile"
        required: true
        type: string
        default: auto
      upstream_profile:
        description: "Upstream patch profile"
        required: true
        type: string
        default: auto
      tweaks:
        description: "Kernel tweaks (see patches/features/tweaks)"
        required: true
        type: choice
        options: [none, balanced, performance]
        default: none
      lto_plus:
        description: "Optional LTO+ profile"
        required: true
        type: boolean
        default: false
      ksu_ref:
        description: "Root provider ref; auto uses target-safe pinned ref"
        required: true
        type: string
        default: auto
      package_anykernel:
        description: "Package AnyKernel3"
        required: true
        type: boolean
        default: true
      rom_family:
        description: "ROM family metadata"
        required: true
        type: choice
        options: [auto, oss, hyperos, miui, custom-android, legacy]
        default: auto
      anykernel_profile:
        description: "AnyKernel profile"
        required: true
        type: string
        default: auto
      anykernel3_ref:
        description: "AnyKernel3 ref for external repository"
        required: true
        type: string
        default: master
      kernel_name:
        description: "Kernel display name"
        required: false
        type: string
        default: ""
      apt_packages:
        description: "Optional extra apt packages"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish Harness result as GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trigger-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The Harness handoff is a published prerelease so GET /releases/tags/{tag}
    # can resolve it from GitHub Actions without relying on draft-only visibility.
    permissions:
      contents: write
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Harness preflight
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          bash -n scripts/*.sh scripts/lib/*.sh
          test -f profiles/targets/${{ inputs.build_profile }}.conf
          test -f anykernel/anykernel.sh
          git rev-parse HEAD
          echo "Harness runtime-input contract"
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("harness/kernel-pipeline.yaml").read_text(encoding="utf-8")
          names = [
              "CI_BUILD_SHA", "BUILD_PROFILE", "ROOT_VARIANTS",
              "KERNEL_REPO_OVERRIDE", "KERNEL_REF_OVERRIDE",
              "DEFCONFIG_OVERRIDE", "CONFIG_FRAGMENT_OVERRIDE",
              "JOBS", "TOOLCHAIN", "TOOLCHAIN_VERSION", "LLVM_IAS",
              "CLANG_URL", "GCC_URL", "EXTRA_MAKE_ARGS",
              "PATCH_PROFILE", "UPSTREAM_PROFILE", "LTO_PLUS", "KSU_REF",
              "PACKAGE_ANYKERNEL", "ROM_FAMILY", "ANYKERNEL_PROFILE",
              "ANYKERNEL3_REF", "BUILD_CUSTOMIZATION",
              "PUBLISH_RELEASE", "TG_TOPIC_ID",
          ]
          for name in names:
              m = re.search(
                  r"- name: " + re.escape(name) +
                  r"\n\s+type: String\n\s+value: ([^\n]+)",
                  text,
              )
              assert m, f"missing Harness variable: {name}"
              assert m.group(1).strip() == "<+input>", f"{name} is not a runtime input"
          print(f"PASS: {len(names)} Harness variables are runtime inputs")
          PY

      - name: Build Harness Runtime Input YAML
        env:
          CI_BUILD_SHA: ${{ github.sha }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          ROOT_VARIANTS: ${{ inputs.root_variants }}
          KERNEL_REPO_OVERRIDE: ${{ inputs.kernel_repo_override }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref_override }}
          DEFCONFIG_OVERRIDE: ${{ inputs.defconfig_override }}
          CONFIG_FRAGMENT_OVERRIDE: ${{ inputs.config_fragment_override }}
          JOBS: ${{ inputs.jobs }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          LLVM_IAS: ${{ inputs.llvm_ias }}
          TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
          PATCH_PROFILE: ${{ inputs.patch_profile }}
          UPSTREAM_PROFILE: ${{ inputs.upstream_profile }}
          LTO_PLUS: ${{ inputs.lto_plus }}
          KSU_REF: ${{ inputs.ksu_ref }}
          ROOT_MANAGER_SOURCE_MODE: auto
          PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
          ROM_FAMILY: ${{ inputs.rom_family }}
          ANYKERNEL_PROFILE: ${{ inputs.anykernel_profile }}
          ANYKERNEL3_REF: ${{ inputs.anykernel3_ref }}
          KERNEL_NAME_INPUT: ${{ inputs.kernel_name }}
          TWEAKS_INPUT: ${{ inputs.tweaks }}
          APT_PACKAGES_INPUT: ${{ inputs.apt_packages }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          names = [
              "CI_BUILD_SHA", "BUILD_PROFILE", "ROOT_VARIANTS",
              "KERNEL_REPO_OVERRIDE", "KERNEL_REF_OVERRIDE",
              "DEFCONFIG_OVERRIDE", "CONFIG_FRAGMENT_OVERRIDE",
              "JOBS", "TOOLCHAIN", "TOOLCHAIN_VERSION", "LLVM_IAS",
              "CLANG_URL", "GCC_URL", "EXTRA_MAKE_ARGS",
              "PATCH_PROFILE", "UPSTREAM_PROFILE", "LTO_PLUS", "KSU_REF",
              "PACKAGE_ANYKERNEL", "ROM_FAMILY", "ANYKERNEL_PROFILE",
              "ANYKERNEL3_REF", "BUILD_CUSTOMIZATION",
              "PUBLISH_RELEASE", "TG_TOPIC_ID",
          ]

          values = {name: os.environ.get(name, "") for name in names}
          # One URL input on the GitHub side; Harness keeps separate variables.
          url = os.environ.get("TOOLCHAIN_URL", "")
          is_gcc = os.environ.get("TOOLCHAIN", "") == "gcc"
          values["CLANG_URL"] = "" if is_gcc else url
          values["GCC_URL"] = url if is_gcc else ""
          values["BUILD_CUSTOMIZATION"] = json.dumps({
              "kernel_name": os.environ.get("KERNEL_NAME_INPUT", ""),
              "apt_packages": os.environ.get("APT_PACKAGES_INPUT", ""),
              "tweaks": os.environ.get("TWEAKS_INPUT", "none"),
          }, separators=(",", ":"), ensure_ascii=False)
          lines = ["pipeline:", "  identifier: Universal_Kernel_Build", "  variables:"]
          for name in names:
              lines.extend([
                  f"    - name: {name}",
                  "      type: String",
                  "      value: " + json.dumps(values[name], ensure_ascii=False),
              ])

          runtime_yaml = "\n".join(lines) + "\n"
          with open("harness-inputs.yaml", "w", encoding="utf-8") as fh:
              fh.write(runtime_yaml)

          first_lines = runtime_yaml.splitlines()
          if first_lines[:2] != ["pipeline:", "  identifier: Universal_Kernel_Build"]:
              raise SystemExit("generated Harness runtime input is missing pipeline.identifier")

          print("=== Harness Runtime Input Names ===")
          print("\n".join(names))
          print(f"Runtime input count: {len(names)}")
          if len(names) > 25:
              raise SystemExit("Harness runtime input count exceeds 25")
          PY
      - name: Trigger Harness pipeline
        id: trigger
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          PIPELINE_ID: Universal_Kernel_Build
        run: |
          set -euo pipefail

          endpoint="https://app.harness.io/pipeline/api/pipeline/execute/${PIPELINE_ID}?accountIdentifier=${HARNESS_ACCOUNT}&orgIdentifier=${HARNESS_ORG}&projectIdentifier=${HARNESS_PROJECT}&moduleType=CI"

          grep -q '^pipeline:$' harness-inputs.yaml
          grep -q '^  identifier: Universal_Kernel_Build$' harness-inputs.yaml
          grep -q '^  variables:$' harness-inputs.yaml

          echo "Executing Harness pipeline with runtime input YAML:"
          sed -n '1,8p' harness-inputs.yaml

          http_code="$(curl -sS --retry 2 --retry-delay 2 \
            -X POST "$endpoint" \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "Content-Type: application/yaml" \
            --data-binary @harness-inputs.yaml \
            -o harness-response.json \
            -w '%{http_code}')"

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Harness execution request failed with HTTP $http_code"
            cat harness-response.json >&2 || true
            exit 1
          fi

          cat harness-response.json

          PLAN_ID="$(python3 -c 'import json; d=json.load(open("harness-response.json",encoding="utf-8")); pe=(d.get("data") or {}).get("planExecution") or {}; print(pe.get("uuid") or pe.get("planExecutionId") or d.get("planExecutionId") or d.get("executionId") or (d.get("execution_details") or {}).get("execution_id") or "")')"

          [[ -n "$PLAN_ID" ]] || {
            echo "::error::Harness response did not contain an execution id"
            cat harness-response.json >&2
            exit 1
          }

          echo "plan_execution_id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "release_tag=harness-$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "Harness plan execution: $PLAN_ID"
      - name: Telegram Harness trigger failure fallback
        if: always() && steps.trigger.outputs.plan_execution_id == ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          HARNESS_RUN_URL: https://app.harness.io/ng/account/${{ secrets.HARNESS_ACCOUNT_ID }}/module/ci/orgs/default/projects/ci_build/pipelines/Universal_Kernel_Build
        run: |
          set +e
          python3 - <<'PY_TRIGGER_FALLBACK'
          import html
          import os
          import urllib.parse
          import urllib.request
          
          bot=os.environ.get('TG_BOT_TOKEN','')
          chat=os.environ.get('TG_CHAT_ID','')
          topic=os.environ.get('TG_TOPIC_ID','')
          if not (bot and chat and topic):
              raise SystemExit(0)
          profile=html.escape(os.environ.get('BUILD_PROFILE','unknown'))
          url=os.environ.get('HARNESS_RUN_URL','')
          text=f'❌ <b>Zairenkai Harness trigger gagal</b>\n🎯 Target: <code>{profile}</code>\n🚨 <code>Execution ID tidak diterima dari Harness.</code>'
          if url:
              text += f'\n🔗 <a href="{html.escape(url, quote=True)}">Harness pipeline</a>'
          data=urllib.parse.urlencode({'chat_id':chat,'message_thread_id':topic,'parse_mode':'HTML','disable_web_page_preview':'true','text':text}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{bot}/sendMessage', data=data, method='POST')
          try:
              urllib.request.urlopen(req, timeout=15).read()
          except Exception as exc:
              print(f'[telegram-fallback] trigger failure notification failed: {exc}')
          PY_TRIGGER_FALLBACK
      - name: Live monitor Harness execution
        if: steps.trigger.outputs.plan_execution_id != ''
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG: default
          HARNESS_PROJECT: ci_build
          HARNESS_PIPELINE: Universal_Kernel_Build
          HARNESS_REQUESTED_BUILD_PROFILE: ${{ inputs.build_profile }}
          HARNESS_PLAN_EXECUTION_ID: ${{ steps.trigger.outputs.plan_execution_id }}
          CI_BUILD_SHA: ${{ github.sha }}
          HARNESS_EXECUTION_URL: https://app.harness.io/ng/account/${{ secrets.HARNESS_ACCOUNT_ID }}/module/ci/orgs/default/projects/ci_build/pipelines/Universal_Kernel_Build/executions/${{ steps.trigger.outputs.plan_execution_id }}/pipeline
          DEVICE: ${{ inputs.build_profile == 'garnet-gki' && 'garnet' || 'lavender' }}
          KERNEL_BRANCH: ${{ inputs.build_profile }}
          # Live build progress is emitted directly by the Harness build step.
          # Keep the lifecycle monitor Telegram-free to avoid duplicate dashboards.
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HARNESS_POLL_SECONDS: "3"
          HARNESS_UNKNOWN_IDLE_GRACE_SECONDS: "45"
          TG_UI_INTERVAL: "2"
          HARNESS_API_TIMEOUT: "10"
          HARNESS_GRAPH_FALLBACK_EVERY: "3"
          HARNESS_RELEASE_CHECK_EVERY: "6"
          HARNESS_EXPECTED_STAGE_NAME: "Kernel Build"
          HARNESS_EXPECTED_STEP_NAME: "Build Universal Kernel Matrix"
          TG_HTTP_TIMEOUT: "8"
          HARNESS_MAX_SECONDS: "8100"
        run: |
          set -euo pipefail
          echo "Requested BUILD_PROFILE=$HARNESS_REQUESTED_BUILD_PROFILE"
          python3 scripts/harness_monitor.py

      - name: Materialize Harness artifacts into GitHub Actions
        if: always() && steps.trigger.outputs.plan_execution_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
          OUT_DIR: ${{ runner.temp }}/harness-artifacts
          MAX_ATTEMPTS: "36"
          SLEEP_SECONDS: "5"
        run: |
          set -euo pipefail
          bash scripts/fetch_harness_staging_assets.sh
          printf 'Harness artifact handoff contents:\n'
          find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload Harness artifacts to GitHub Actions
        if: always() && steps.trigger.outputs.plan_execution_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ inputs.build_profile }}-${{ steps.trigger.outputs.plan_execution_id }}
          path: |
            ${{ runner.temp }}/harness-artifacts/**
            harness-monitor.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Telegram Harness failure fallback
        if: always() && steps.trigger.outputs.plan_execution_id != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          HARNESS_MONITOR_FILE: harness-monitor.json
          HARNESS_RUN_URL: https://app.harness.io/ng/account/${{ secrets.HARNESS_ACCOUNT_ID }}/module/ci/orgs/default/projects/ci_build/pipelines/Universal_Kernel_Build/executions/${{ steps.trigger.outputs.plan_execution_id }}/pipeline
        run: bash scripts/send_harness_failure_to_telegram.sh

      - name: Relay published Harness release to Telegram release topic
        if: always() && steps.trigger.outputs.plan_execution_id != '' && inputs.publish_release
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_RELEASE_TOPIC_ID: ${{ secrets.TG_RELEASE_TOPIC_ID }}
          TG_RELEASE_REQUIRE_TOPIC: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          TG_SKIP_ASSET_UPLOAD: "false"
          HARNESS_MONITOR_FILE: harness-monitor.json
        run: bash scripts/send_release_to_telegram.sh

      - name: Clean transient Harness release assets
        if: always() && steps.trigger.outputs.plan_execution_id != '' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
        run: bash scripts/cleanup_ci_release_transients.sh

      - name: Propagate Harness result
        if: always()
        run: |
          set -euo pipefail
          test -f harness-monitor.json
          status="$(python3 -c 'import json; print(json.load(open("harness-monitor.json",encoding="utf-8")).get("status","UNKNOWN"))')"
          case "$status" in SUCCESS|SUCCEEDED) exit 0 ;; *) echo "Harness result: $status"; exit 1 ;; esac
