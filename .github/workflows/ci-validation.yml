name: CI Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline suite: static checks, contracts, and behavioral tests with local
  # fixtures. Everything here also runs locally with `bash tests/run_all.sh`.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3 python3-yaml zip unzip shellcheck

      - name: Test suite (offline)
        run: bash tests/run_all.sh

  # Network suite: resolves every profile x default root variant against the
  # real upstream provider sources, applies host patches to the real kernel
  # trees, and checks that every tweak survives Kconfig on each target.
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3 bc bison flex clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev

      - name: Test suite (remote patch applicability)
        run: bash tests/run_all.sh --remote-only
