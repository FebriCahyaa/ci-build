name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck ruby

      - name: Workflow dispatch input limits
        run: |
          ruby - <<'RUBY'
          require "yaml"

          files = [
            ".github/workflows/kernel.yml",
            ".github/workflows/harness-kernel.yml",
            ".github/workflows/ci-validation.yml",
            ".github/workflows/rom.yml"
          ]

          files.each do |file|
            data = YAML.load_file(file)
            triggers = data["on"] || data[true] || {}
            dispatch = triggers["workflow_dispatch"]
            next unless dispatch

            inputs = dispatch["inputs"] || {}
            count = inputs.length
            abort "#{file}: workflow_dispatch has #{count} inputs; GitHub allows at most 25" if count > 25
            puts "workflow_dispatch inputs OK: #{file} (#{count})"
          end
          RUBY

      - name: Bash syntax
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: ShellCheck errors
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S error

      - name: Patch registry structure
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -x scripts/apply_patch_series.sh
          test -x scripts/run_with_heartbeat.sh
          test -x scripts/set_kernel_name.sh
          test -f kernel-name
          test "$(awk 'NF && $0 !~ /^[[:space:]]*#/ {count++} END {print count+0}' kernel-name)" -eq 1
          ! grep -R -nE '^@@$' patches --include='*.patch'
          test -f patches/devices/lavender/4.19/series.conf
          test -f patches/root-manager/resukisu/4.19/series.conf
          test -f patches/upstream/codelinaro/sdm660-4.19/series.conf
          test -f patches/features/lto-plus/lavender-4.19/thinlto.config

      - name: Python monitor validation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/harness_monitor.py scripts/patch_content_check.py

      - name: Patch format and series validation
        run: |
          set -euo pipefail
          python3 scripts/validate_patch_format.py

      - name: Modular patch registry
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -x scripts/apply_patch_series.sh
          test -x scripts/set_kernel_name.sh
          test -f patches/devices/lavender/4.19/series.conf
          test -f patches/root-manager/kernelsu/4.19/series.conf
          test -f patches/root-manager/kernelsu-next/4.19/series.conf
          test -f patches/root-manager/resukisu/4.19/series.conf
          test -f patches/upstream/codelinaro/sdm660-4.19/series.conf
          test -f patches/features/lto-plus/lavender-4.19/thinlto.config

      - name: AnyKernel profile selection
        run: |
          set -euo pipefail
          test "$(DEVICE=lavender KERNEL_VERSION=4.4.325 ROM_FAMILY=legacy ANYKERNEL_PROFILE=auto ./scripts/select_anykernel_profile.sh | xargs basename)" = "lavender-4.4.conf"
          test "$(DEVICE=lavender KERNEL_VERSION=4.19.325 ROM_FAMILY=custom-android ANYKERNEL_PROFILE=auto ./scripts/select_anykernel_profile.sh | xargs basename)" = "lavender-4.19.conf"
          test "$(DEVICE=garnet KERNEL_VERSION=5.10.0 ROM_FAMILY=oss ANYKERNEL_PROFILE=auto ./scripts/select_anykernel_profile.sh | xargs basename)" = "garnet-oss.conf"
          test "$(DEVICE=garnet KERNEL_VERSION=5.10.0 ROM_FAMILY=hyperos ANYKERNEL_PROFILE=auto ./scripts/select_anykernel_profile.sh | xargs basename)" = "garnet-hyperos.conf"

      - name: YAML parse
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            ARGV.each do |file|
              YAML.load_file(file)
              puts "OK #{file}"
            end
          ' \
            .github/workflows/kernel.yml \
            .github/workflows/harness-kernel.yml \
            .github/workflows/rom.yml \
            harness/kernel-pipeline.yaml \
            harness/rom-pipeline.yaml
