name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Canonical target profile"
        required: true
        type: choice
        options: [lavender-4.4, lavender-4.19, garnet-gki]
        default: lavender-4.4
      variants:
        description: "Root variants: default (profile set), all, or e.g. vanilla,kernelsu-next,resukisu,resukisu-susfs,sukisu-ultra"
        required: true
        type: string
        default: default
      kernel_repo_override:
        description: "Optional kernel repository override"
        required: false
        type: string
        default: ""
      kernel_ref_override:
        description: "Optional kernel branch/tag/commit override"
        required: false
        type: string
        default: ""
      defconfig_override:
        description: "Optional defconfig override"
        required: false
        type: string
        default: ""
      config_fragment_override:
        description: "Optional config fragment override; none disables"
        required: false
        type: string
        default: ""
      jobs:
        description: "Parallel jobs; 0 = auto"
        required: true
        type: string
        default: "0"
      toolchain:
        description: "Toolchain family"
        required: true
        type: choice
        options: [auto, aosp, aosp-r416183b, zyc-10, proton, llvm-18, neutron, llvm, gcc, system]
        default: auto
      toolchain_version:
        description: "Toolchain revision/tag"
        required: true
        type: string
        default: auto
      llvm_ias:
        description: "LLVM IAS mode"
        required: true
        type: choice
        options: [auto, "0", "1"]
        default: auto
      toolchain_url:
        description: "Optional custom toolchain archive URL (clang, or GCC when toolchain=gcc)"
        required: false
        type: string
        default: ""
      extra_make_args:
        description: "Optional extra make arguments"
        required: false
        type: string
        default: ""
      patch_profile:
        description: "Modular patch profile (auto/none/custom)"
        required: true
        type: string
        default: auto
      upstream_profile:
        description: "Upstream patch profile (auto/none/custom)"
        required: true
        type: string
        default: auto
      tweaks:
        description: "Kernel tweaks (see patches/features/tweaks)"
        required: true
        type: choice
        options: [none, balanced, performance]
        default: none
      lto_plus:
        description: "Optional LTO+ feature profile"
        required: true
        type: boolean
        default: false
      ksu_ref:
        description: "Root provider ref; auto selects profile-safe ref"
        required: true
        type: string
        default: auto
      package_anykernel:
        description: "Package AnyKernel3 ZIPs"
        required: true
        type: boolean
        default: true
      rom_family:
        description: "ROM family metadata"
        required: true
        type: choice
        options: [auto, oss, hyperos, miui, custom-android, legacy]
        default: auto
      anykernel_profile:
        description: "AnyKernel profile; auto uses target registry"
        required: true
        type: string
        default: auto
      anykernel3_ref:
        description: "AnyKernel3 ref when external repo is used"
        required: true
        type: string
        default: master
      kernel_name:
        description: "Kernel display name"
        required: false
        type: string
        default: ""
      apt_packages:
        description: "Optional extra apt packages"
        required: false
        type: string
        default: ""
      release:
        description: "Create/update GitHub Release"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Optional release tag; default is profile + run number"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CI_BUILD_SHA: ${{ github.sha }}
  GH_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.resolve.outputs.variants }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve variants
        id: resolve
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
          VARIANTS: ${{ inputs.variants }}
        shell: bash
        run: |
          set -euo pipefail
          # "default"/"all" expand to the profile's PROFILE_DEFAULT_VARIANTS;
          # explicit lists are normalized, de-duplicated and validated.
          variants="$(bash scripts/resolve_variants.sh --json)"
          echo "variants=${variants}" >> "${GITHUB_OUTPUT}"
          echo "Resolved matrix: ${variants}"

  build:
    name: ${{ inputs.build_profile }} / ${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          # Toolchain downloads (0.4-2 GB) are reused across runs; the directory
          # also keeps the last real object count used for compile progress.
          path: ${{ runner.temp }}/toolchains
          key: toolchain-${{ inputs.build_profile }}-${{ inputs.toolchain }}-${{ inputs.toolchain_version }}-v1-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ inputs.build_profile }}-${{ inputs.toolchain }}-${{ inputs.toolchain_version }}-v1-

      # Each variant has its own .config (autoconf.h is part of every object),
      # so ccache only pays off across runs of the same profile + variant.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ inputs.build_profile }}-${{ matrix.variant }}-${{ inputs.toolchain }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.build_profile }}-${{ matrix.variant }}-${{ inputs.toolchain }}-

      - name: Install dependencies
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          set -euo pipefail
          bash scripts/install_deps.sh

      - name: Validate profile contract
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail
          profile_env="$(BUILD_PROFILE="$BUILD_PROFILE" bash scripts/resolve_build_profile.sh)"
          eval "$profile_env"
          printf 'PROFILE_ID=%s\nPROFILE_DEVICE=%s\nPROFILE_KERNEL_FAMILY=%s\nPROFILE_KERNEL_REPO=%s\nPROFILE_DEFCONFIG=%s\nPROFILE_ANYKERNEL_PROFILE=%s\n' \
            "$PROFILE_ID" "$PROFILE_DEVICE" "$PROFILE_KERNEL_FAMILY" "$PROFILE_KERNEL_REPO" "$PROFILE_DEFCONFIG" "$PROFILE_ANYKERNEL_PROFILE"

      - name: Build kernel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          TG_REQUIRE_TOPIC: "true"
          CI_BUILD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_GITHUB_STATUS_ENABLED: "false"
          BUILD_PROFILE: ${{ inputs.build_profile }}
          ROOT_VARIANT: ${{ matrix.variant }}
          VARIANTS: ${{ inputs.variants }}
          KERNEL_REPO: ${{ inputs.kernel_repo_override }}
          KERNEL_BRANCH: ${{ inputs.kernel_ref_override }}
          DEFCONFIG: ${{ inputs.defconfig_override }}
          CONFIG_FRAGMENT: ${{ inputs.config_fragment_override }}
          JOBS: ${{ inputs.jobs }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          LLVM_IAS: ${{ inputs.llvm_ias }}
          TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
          TOOLCHAIN_CACHE_DIR: ${{ runner.temp }}/toolchains
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 1G
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
          TWEAKS: ${{ inputs.tweaks }}
          PATCH_PROFILE: ${{ inputs.patch_profile }}
          UPSTREAM_PROFILE: ${{ inputs.upstream_profile }}
          LTO_PLUS: ${{ inputs.lto_plus }}
          KSU_REF: ${{ inputs.ksu_ref }}
          ROOT_MANAGER_SOURCE_MODE: auto
          PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
          ROM_FAMILY: ${{ inputs.rom_family }}
          ANYKERNEL_PROFILE: ${{ inputs.anykernel_profile }}
          ANYKERNEL3_REF: ${{ inputs.anykernel3_ref }}
          KERNEL_NAME: ${{ inputs.kernel_name }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          INSTALL_SHELLCHECK: "false"
          TG_SEND_ARTIFACTS: "false"
        run: |
          set -euo pipefail
          bash scripts/build_kernel.sh

      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ inputs.build_profile }}-${{ matrix.variant }}
          path: |
            work/artifacts/**
            work/failure-summary.txt
            work/failure-build.log.gz
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release ${{ inputs.build_profile }}
    needs: build
    # Build failures still leave successful matrix artifacts and diagnostics.
    # Finalize those instead of silently skipping the release job.
    if: always() && inputs.release && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install minimal release tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl python3 zip

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release/artifacts

      - name: Assemble release
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          set -Eeuo pipefail
          mkdir -p release/assets
          SOURCE_ROOT="$PWD/release/artifacts" \
          ASSET_DIR="$PWD/release/assets" \
          CHANGELOG_OUT="$PWD/release/CHANGELOG.md" \
          BUILD_PROFILE="$BUILD_PROFILE" \
          MATRIX_SUMMARY="$PWD/release/artifacts/matrix-summary.txt" \
          bash scripts/assemble_release_assets.sh
          package_count="$(find release/assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          if (( package_count == 0 )); then
            echo '::error::No successful kernel/AnyKernel package was produced; release cannot be published.'
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('zairenkai-{0}-run-{1}', inputs.build_profile, github.run_number) }}
          RELEASE_NAME: Zairenkai ${{ inputs.build_profile }}
          RELEASE_BODY_FILE: release/CHANGELOG.md
          RELEASE_DRAFT: "false"
          RELEASE_PRERELEASE: "false"
          ASSET_DIR: release/assets
        run: |
          set -euo pipefail
          bash scripts/publish_ci_release.sh

      - name: Relay published kernel release to Telegram release topic
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_RELEASE_TOPIC_ID: ${{ secrets.TG_RELEASE_TOPIC_ID }}
          TG_RELEASE_REQUIRE_TOPIC: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('zairenkai-{0}-run-{1}', inputs.build_profile, github.run_number) }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          RELEASE_STATUS: "PUBLISHED"
          TG_SKIP_ASSET_UPLOAD: "false"
        run: bash scripts/send_release_to_telegram.sh
