name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository URL"
        required: true
        type: string
        default: "https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng"
      kernel_branch:
        description: "Kernel branch, tag, or ref"
        required: true
        type: string
        default: "main"
      device:
        description: "Device/codename label"
        required: true
        type: string
        default: "lavender"
      arch:
        description: "Architecture (auto, arm64, arm, x86, ...)"
        required: true
        type: choice
        options: [auto, arm64, arm, x86, riscv]
        default: auto
      defconfig:
        description: "Kernel defconfig target (auto = detect)"
        required: true
        type: string
        default: "auto"
      config_fragment:
        description: "Config fragment (auto = detect device fragment, none = disable)"
        required: true
        type: string
        default: "auto"
      jobs:
        description: "Parallel jobs; 0 = auto"
        required: true
        type: string
        default: "0"
      toolchain:
        description: "Toolchain family"
        required: true
        type: choice
        options: [auto, aosp, proton, neutron, llvm, gcc, system]
        default: auto
      toolchain_version:
        description: "Toolchain revision/tag (auto = source-compatible resolver)"
        required: true
        type: string
        default: "auto"
      llvm_ias:
        description: "LLVM IAS mode"
        required: true
        type: choice
        options: [auto, "0", "1"]
        default: auto
      cross_compile:
        description: "CROSS_COMPILE prefix (auto = detected)"
        required: false
        type: string
        default: "auto"
      clang_url:
        description: "Optional custom Clang archive URL"
        required: false
        type: string
        default: ""
      gcc_url:
        description: "Optional custom GCC archive URL"
        required: false
        type: string
        default: ""
      apt_packages:
        description: "Optional extra apt packages"
        required: false
        type: string
        default: ""
      extra_make_args:
        description: "Optional extra make arguments"
        required: false
        type: string
        default: ""
      enable_ksu:
        description: "KernelSU provider"
        required: true
        type: choice
        options: [false, true, kernelsu-next, resukisu]
        default: false
      ksu_ref:
        description: "KernelSU provider branch/tag/commit"
        required: false
        type: string
        default: "main"
      patch_profile:
        description: "Modular source patch profile"
        required: true
        type: string
        default: "none"
      upstream_profile:
        description: "Upstream patch profile"
        required: true
        type: string
        default: "none"
      lto_plus:
        description: "Optional LTO+ feature profile"
        required: true
        type: choice
        options: [false, true]
        default: false
      kernel_name:
        description: "Kernel display name (maps to localversion-cip)"
        required: false
        type: string
        default: ""
      package_anykernel:
        description: "Package an AnyKernel3 ZIP"
        required: true
        type: boolean
        default: false
      rom_family:
        description: "ROM family for AnyKernel profile selection"
        required: true
        type: choice
        options: [auto, oss, hyperos, miui, custom-android, legacy]
        default: auto
      anykernel_profile:
        description: "AnyKernel profile (auto = device/kernel/ROM detection)"
        required: true
        type: string
        default: "auto"
      anykernel3_ref:
        description: "AnyKernel3 branch, tag, or commit"
        required: true
        type: string
        default: "master"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential cpio git curl python3 zip xz-utils zstd \
            ca-certificates tar gzip ${{ inputs.apt_packages }}

      - name: Build kernel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_REF_TYPE: auto
          DEVICE: ${{ inputs.device }}
          ARCH: ${{ inputs.arch }}
          DEFCONFIG: ${{ inputs.defconfig }}
          CONFIG_FRAGMENT: ${{ inputs.config_fragment }}
          JOBS: ${{ inputs.jobs }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          LLVM_IAS: ${{ inputs.llvm_ias }}
          CROSS_COMPILE: ${{ inputs.cross_compile }}
          CROSS_COMPILE_ARM32: ""
          CLANG_URL: ${{ inputs.clang_url }}
          GCC_URL: ${{ inputs.gcc_url }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
          SCHEDULER_PROFILE: auto
          PATCH_PROFILE: ${{ inputs.patch_profile }}
          UPSTREAM_PROFILE: ${{ inputs.upstream_profile }}
          LTO_PLUS: ${{ inputs.lto_plus }}
          KERNEL_NAME: ${{ inputs.kernel_name }}
          ENABLE_KSU: ${{ inputs.enable_ksu }}
          KSU_REF: ${{ inputs.ksu_ref }}
          PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
          ROM_FAMILY: ${{ inputs.rom_family }}
          ANYKERNEL_PROFILE: ${{ inputs.anykernel_profile }}
          ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3
          ANYKERNEL3_REF: ${{ inputs.anykernel3_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x \
            scripts/build_kernel.sh \
            scripts/detect_defconfig.sh \
            scripts/toolchain_resolver.sh \
            scripts/apply_patch_series.sh \
            scripts/set_kernel_name.sh \
            scripts/sync_localversion_files.sh \
            scripts/bump_localversion_st.sh

          case "${ENABLE_KSU}" in
            false)
              export ENABLE_KSU=false
              export KSU_PROVIDER=auto
              ;;
            true)
              export ENABLE_KSU=true
              export KSU_PROVIDER=auto
              ;;
            kernelsu-next|resukisu)
              export ENABLE_KSU=true
              export KSU_PROVIDER="${ENABLE_KSU}"
              ;;
            *)
              echo "ERROR: unsupported enable_ksu=${ENABLE_KSU}" >&2
              exit 2
              ;;
          esac

          ./scripts/build_kernel.sh

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device }}
          path: |
            work/Kernel-${{ inputs.device }}-*.tar.gz
            work/artifacts/Kernel-${{ inputs.device }}-*-AnyKernel3.zip
          if-no-files-found: warn
